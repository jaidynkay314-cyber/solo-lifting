.bcmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.bcmp figure { margin: 0; }
.bcmp img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; border: 1px solid var(--edge-dim); }
.bcmp figcaption { font-size: 12px; color: var(--muted); text-align: center; padding-top: 3px; }

.bweek { width: 100%; border-collapse: collapse; font-size: 13px; }
.bweek th { text-align: left; font-family: var(--font-display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; color: var(--muted); padding: 4px 8px 6px 0; white-space: nowrap; }
.bweek td { vertical-align: top; padding: 6px 10px 6px 0; border-top: 1px solid var(--edge-dim); white-space: nowrap; }
.bweek td small { display: block; color: var(--muted); font-size: 11px; }
.bweek td small.dn { color: #5ee39a; }
.bweek td small.up { color: var(--gold); }
#bpose { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 7px 10px; }

.fsearch { display: flex; gap: 8px; margin-bottom: 8px; }
.fsearch input { flex: 1; min-width: 0; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 10px 11px; font-size: 16px; }
.fresl { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
.fres { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 8px 10px; text-align: left; display: flex; flex-direction: column; }
.fres b { font-weight: 600; font-size: 14px; }
.fres small { color: var(--muted); font-size: 12px; }
.fpick { border: 1px solid #3a9a6a; background: var(--sunk); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.fpick > small { color: var(--muted); font-size: 12px; }
.fpick .fquick { margin: 0; align-items: center; }
.fcalc { font-size: 14px; color: var(--muted); }
.fcalc b { font-family: var(--font-display); font-size: 20px; color: #5ee39a; }


@media (prefers-reduced-motion: reduce) { .pov *, .pov *::before, .pov *::after, .cdet *, .cdet *::before, .cdet *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

</div>

<script>
/* ================= DEFAULT SCRIPT (everyone starts here) ================= */
const PROGRAM = {
  UA: { short: "Mon", name: "Upper A", label: "Upper A", focus: "Push focus", cardio: { goal: "Treadmill: walk 5, then run", min: 10 }, ex: [
    ["chest-press", "Machine chest press", 3, 8, 12], ["lat-pulldown", "Lat pulldown (wide grip)", 3, 8, 12],
    ["shoulder-press", "Machine shoulder press", 3, 8, 12], ["cable-row", "Seated cable row", 3, 10, 12],

  const line = xy.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
  const end = xy[xy.length - 1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path class="a" d="${line} L${end[0].toFixed(1)} ${H} L${P} ${H} Z"/><path class="l" d="${line}"/><circle cx="${end[0].toFixed(1)}" cy="${end[1].toFixed(1)}" r="3"/></svg>`;

function login(id) {
  const nm = nameOf(id).toLowerCase();
  for (const h of Object.values(S.hunters)) {
    if (h.id === id || !h.local || h.name.toLowerCase() !== nm) continue;
    for (const [k, b] of Object.entries(S.sessions)) if (b.profile === h.id) {
      const nk = keyOf(id, b.date, b.day);

      delete S.sessions[k]; delete S.outbox.s[k];

// a small line chart: series = [{ name, color, pts: [{ x: date, y }] }]; dates spaced by real time
function lineChart(series, unit = "", h = 150) {
  const all = series.flatMap(s => s.pts); if (all.length < 2) return "";
  const W = 320, H = h, L = 34, R = 8, T = 10, B = 22;
  const xs = all.map(p => parseDate(p.x).getTime()), x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  let lo = Math.min(...all.map(p => p.y)), hi = Math.max(...all.map(p => p.y)); const pad = (hi - lo) * .12 || 1; lo -= pad; hi += pad;
  const X = d => L + (parseDate(d).getTime() - x0) / ((x1 - x0) || 1) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const dp = hi - lo < 12 ? 1 : 0;
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad].map(v => `<text x="${L - 4}" y="${Y(v) + 4}" text-anchor="end">${+v.toFixed(dp)}</text><line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/>`).join("");
  const lines = series.filter(s => s.pts.length).map(s => {
    const d = s.pts.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(" ");
    return `<path d="${d}" stroke="${s.color}" fill="none" stroke-width="${s.thin ? 1.5 : 2.4}" ${s.dash ? `stroke-dasharray="4 4"` : ""}/>${s.dots === false ? "" : s.pts.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6" fill="${s.color}"/>`).join("")}`;
  }).join("");
  const first = all.reduce((a, p) => p.x < a ? p.x : a, all[0].x), last = all.reduce((a, p) => p.x > a ? p.x : a, all[0].x);
  return `<figure class="lchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.name).join(" and "))} over time">${ticks}${lines}
    <text x="${L}" y="${H - 6}">${fmtShort(first)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtShort(last)}</text></svg>
    <figcaption>${series.filter(s => s.pts.length).map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}${unit ? ` (${unit})` : ""}</span>`).join("")}</figcaption></figure>`;
}

    const days = DAYS.filter(x => x === d ? !cur.includes(x) : cur.includes(x));

  }
  if (act === "psets") editPlan(p => { p.ex[i][1] = Math.max(1, Math.min(8, p.ex[i][1] + +t.dataset.d)); });
  if (act === "pmove") editPlan(p => { const j = i + +t.dataset.d; if (j >= 0 && j < p.ex.length) [p.ex[i], p.ex[j]] = [p.ex[j], p.ex[i]]; });
  if (act === "pdel") editPlan(p => { p.ex.splice(i, 1); });
  if (act === "preset") {
    if (S.armed !== "preset") { arm("preset"); renderProgram(); return; }
    S.armed = null; delete S.hunters[S.me].program[S.pday]; programChanged(S.pday); renderProgram();
  }
  if (act === "cxcancel") { S.creating = false; renderProgram(); }
  if (act === "cxsave") {
    const name = ($("#cx-name").value || "").trim().replace(/\s+/g, " ").slice(0, 32), msg = $("#cx-msg");
    if (name.length < 3) { msg.hidden = false; msg.textContent = "Give it a name of at least 3 letters."; return; }
    const dup = Object.values(catalogue()).find(x => x.name.toLowerCase() === name.toLowerCase());
    const nid = dup ? dup.id : `c-${slug(name)}-${rnd().slice(0, 4)}`;
    if (dup && dup.type === "min") { msg.hidden = false; msg.textContent = `"${dup.name}" already exists as a timed activity. Add it from + Add bonus exercise on the Quest tab instead.`; return; }
    if (!dup) { S.custom[nid] = { id: nid, name, type: $("#cx-type").value, stat: $("#cx-stat").value, cat: "Custom", created_by: S.me }; S.outbox.x[nid] = rnd(); CATALOGUE = null; }

  if (t.id === "titleSel") { S.hunters[S.me].title = t.value || null; dirtyHunter(S.me); render(); }

/* ================= PENALTY ZONE CRACKS ================= */
const Cracks = (() => {
  const cv = $("#cracks"), ctx = cv.getContext("2d");
  let segs = [], raf = 0, t0 = 0, on = false, w = 0, h = 0, lastDraw = 0;
  function grow(x, y, ang, len, width, depth, delay) {
    const pts = [[x, y]]; let l = 0;
    while (l < len) {
      const step = 5 + Math.random() * 9;
      ang += (Math.random() - .5) * .9;
      x += Math.cos(ang) * step; y += Math.sin(ang) * step; l += step; pts.push([x, y]);
      if (depth < 2 && Math.random() < .14) grow(x, y, ang + (Math.random() < .5 ? -1 : 1) * (.5 + Math.random() * .7), (len - l) * .6, width * .6, depth + 1, delay + .25 + l / len * 1.2);
    }
    if (pts.length > 1) segs.push({ pts, width, delay });
  }
  function build() {
    const dpr = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    segs = [];
    const n = Math.round((w + h) / 80), reach = Math.min(w, h) * .15;
    for (let i = 0; i < n; i++) {
      const side = i % 4; let x, y, a;
      if (side === 0) { x = Math.random() * w; y = 0; a = Math.PI / 2; }
      else if (side === 1) { x = w; y = Math.random() * h; a = Math.PI; }
      else if (side === 2) { x = Math.random() * w; y = h; a = -Math.PI / 2; }
      else { x = 0; y = Math.random() * h; a = 0; }
      grow(x, y, a + (Math.random() - .5) * .8, 30 + Math.random() * reach, 2.4, 0, Math.random() * 1.6);
    }
  }
  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    const flicker = reduced ? 1 : (.72 + .28 * Math.sin(t * 2.3)) * (Math.random() < .03 ? .35 : 1);
    const glitch = !reduced && (t % 4.5) < .12;
    ctx.save();
    if (glitch) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 3);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const s of segs) {
      const prog = reduced ? 1 : Math.max(0, Math.min(1, (t - s.delay) / 1.6));
      if (!prog) continue;
      const k = Math.max(2, Math.ceil(s.pts.length * prog));
      ctx.beginPath(); ctx.moveTo(s.pts[0][0], s.pts[0][1]);
      for (let i = 1; i < k; i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
      ctx.shadowColor = "rgba(255,30,50,.9)"; ctx.shadowBlur = 10;
      ctx.strokeStyle = `rgba(255,48,72,${.75 * flicker})`; ctx.lineWidth = s.width; ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = `rgba(255,220,225,${.55 * flicker})`; ctx.lineWidth = Math.max(.6, s.width * .3); ctx.stroke();
    }
    if (glitch) { ctx.fillStyle = "rgba(255,40,60,.12)"; ctx.fillRect(0, Math.random() * h, w, 2 + Math.random() * 8); }
    ctx.restore();
  }
  function loop(now) {
    if (!on) return;
    raf = requestAnimationFrame(loop);
    if (document.hidden || now - lastDraw < 33) return;
    lastDraw = now; draw((now - t0) / 1000);
  }
  addEventListener("resize", () => { if (on) { build(); if (reduced) draw(0); } });
  return {
    start() { if (on) return; on = true; build(); t0 = performance.now(); if (reduced) draw(0); else raf = requestAnimationFrame(loop); },
    stop() { on = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, cv.width, cv.height); }
  };
})();

/* ================= REST TIMER ================= */
let tEnd = 0, tInt = null, tDone = false;
function startTimer(sec, label) {
  tEnd = Date.now() + sec * 1000; tDone = false;
  $("#timerL").textContent = `Recovering after ${label}`;
  $("#timer").hidden = false; $("#timer").classList.remove("over");
  clearInterval(tInt); tick(); tInt = setInterval(tick, 250);
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
}
function tick() {
  const left = Math.ceil((tEnd - Date.now()) / 1000);
  if (left <= 0) {
    $("#timerT").textContent = "GO";
    if (!tDone) { tDone = true; $("#timer").classList.add("over"); $("#timerL").textContent = "Stamina restored. Next set."; chime("pr"); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
    return;
  }
  $("#timerT").textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
}
$("#timerAdd").onclick = () => { if (tDone) { tEnd = Date.now(); tDone = false; $("#timer").classList.remove("over"); } tEnd += 15000; tick(); };
$("#timerStop").onclick = () => { clearInterval(tInt); $("#timer").hidden = true; };

/* ================= EXPORT / BACKUP ================= */
const backupJson = () => JSON.stringify({ app: "lift-log", version: 6, exported: new Date().toISOString(), hunters: S.hunters, custom: S.custom, sessions: S.sessions }, null, 1);
function csvText() {
  const q = v => v == null ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const head = ["type", "person", "date", "day", "penalty_day", "quest_cleared", "excused", "item", "category", "stat", "in_plan", "set", "weight_kg", "reps", "seconds", "walk_min", "run_min", "total_min", "distance_km", "pace_min_per_km", "kcal", "protein_g", "kcal_goal", "protein_goal", "kcal_goal_hit", "protein_goal_hit"];
  const rows = [head];
  const R = replay(S.me), who = nameOf(S.me);
  const mine = Object.values(S.sessions).filter(b => b.profile === S.me && !isMeta(b)).sort((a, b) => a.date < b.date ? -1 : 1);
  const row = o => rows.push(head.map(k => o[k] ?? ""));
  for (const b of mine) {
    const plan = planFor(S.me, b.day, b), planIds = new Set(plan.ex.map(e => e[0]));
    const base = { person: who, date: b.date, day: plan.name, penalty_day: R.pen[b.date] ? "yes" : "no", quest_cleared: questDone(b, !!R.pen[b.date]) ? "yes" : "no", excused: b.excused ? "yes" : "no" };
    const c = cardioOf(b);
    if (c.total || c.dist || c.kcal) row({ ...base, type: "cardio", item: KINDS[kindOf(c.kind)].name, category: "Program cardio", stat: "VIT", in_plan: "yes", walk_min: c.walk, run_min: c.run, total_min: c.total, distance_km: c.dist, pace_min_per_km: pace(c) ? pace(c).toFixed(2) : "", kcal: c.kcal });
    for (const [id, arr] of Object.entries(b.ex || {})) {
      const L = CX(id) || { name: id, cat: "", stat: "", type: "wr" };
      arr.forEach((s, i) => { if (setOk(L.type, s)) row({ ...base, type: "lift", item: L.name, category: L.cat, stat: L.stat, in_plan: planIds.has(id) ? "yes" : "no", set: i + 1, weight_kg: s.w, reps: s.r, seconds: s.s }); });
    }
    for (const e of b.bonus || []) {
      const L = CX(e.id); if (!L || !bonusLogged(e)) continue;
      if (L.type === "min") row({ ...base, type: "bonus", item: L.name, category: L.cat, stat: L.stat, in_plan: "no", total_min: e.min, distance_km: e.km });
      else (e.sets || []).forEach((s, i) => { if (setOk(L.type, s)) row({ ...base, type: "bonus", item: L.name, category: L.cat, stat: L.stat, in_plan: "no", set: i + 1, weight_kg: s.w, reps: s.r, seconds: s.s }); });
    }
    if (b.excused && !hasTraining({ ...b, excused: false })) row({ ...base, type: "excused" });
  }
  for (const d of foodDates(S.me)) {
    const f = fuelDay(S.me, d), h = fuelHits(f), g = f.goal || {};
    row({ type: "food", person: who, date: d, item: `${f.items.length} item${f.items.length === 1 ? "" : "s"} logged`, kcal: f.k, protein_g: f.p, kcal_goal: g.k || "", protein_goal: g.p || "", kcal_goal_hit: g.k ? (h.k ? "yes" : "no") : "", protein_goal_hit: g.p ? (h.p ? "yes" : "no") : "" });
  }
  rows.splice(1, rows.length - 1, ...rows.slice(1).sort((a, b) => a[2] < b[2] ? -1 : a[2] > b[2] ? 1 : 0));
  return rows.map(r => r.map(q).join(",")).join("\n");
}
function save(name, text, type) {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch (e) { doCopy(text); }
}
const doExport = () => save(`solo-lifting-backup-${todayStr()}.json`, backupJson(), "application/json");
const doCsv = () => save(`solo-lifting-${nameOf(S.me).toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${todayStr()}.csv`, csvText(), "text/csv");
async function doCopy(text) {
  const ta = $("#exportText"); if (!ta) return; ta.hidden = false; ta.value = text;
  try { await navigator.clipboard.writeText(text); $("#copyBtn").textContent = "Copied"; }
  catch (e) { ta.focus(); ta.select(); $("#copyBtn").textContent = "Select all and copy"; }
}
async function doImport(file) {
  const msg = $("#importMsg"); msg.hidden = false;
  try {
    const o = JSON.parse(await file.text());
    if (!o || o.app !== "lift-log" || typeof o.sessions !== "object") throw new Error("bad");
    let n = 0;
    for (const [id, x] of Object.entries(o.custom || {})) if (!S.custom[id]) { S.custom[id] = x; S.outbox.x[id] = rnd(); CATALOGUE = null; }
    for (const [k, b] of Object.entries(o.sessions)) {
      if (!/^[a-z0-9]+_\d{4}-\d{2}-\d{2}_(UA|LA|UB|LB|FR|WK|SA|SU|VAULT|FOOD)$/.test(k) || !b) continue;
      const cur = S.sessions[k];
      if (!cur || (b.ts || 0) > (cur.ts || 0)) { S.sessions[k] = b; S.outbox.s[k] = rnd(); n++; }
    }
    const hs = o.hunters || Object.fromEntries(Object.entries(o.names || {}).map(([id, name]) => [id, { id, name, title: null }]));
    for (const [id, h] of Object.entries(hs)) if (!S.hunters[id]) { S.hunters[id] = { id, name: h.name || "Hunter", title: h.title || null, program: h.program || null }; S.outbox.h[id] = rnd(); }
    for (const b of Object.values(S.sessions)) if (!S.hunters[b.profile]) { S.hunters[b.profile] = { id: b.profile, name: "Hunter", title: null }; S.outbox.h[b.profile] = rnd(); }
    S.ver++; persist(); pushSoon(); render();
    const m2 = $("#importMsg"); if (m2) { m2.hidden = false; m2.textContent = `Restored ${n} session${n === 1 ? "" : "s"}.`; }
  } catch (e) { msg.textContent = "That file couldn't be read. Choose a .json file made with Export backup."; }
}
