<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="description" content="Daily quest gym tracker">
<title>Solo Lifting</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solo Lifting">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600&display=swap">
<style>
/* Layout: one-column "system window" HUD. Dark-only by design; a missed quest flips the palette to the red Penalty Zone. */
:root {
  --bg: #04060c; --bg-2: #0a1530;
  --panel: rgba(9, 18, 38, .88); --panel-hi: rgba(22, 46, 92, .55);
  --sunk: #08111f; --fg: #dbe8ff; --muted: #7f96bd;
  --edge: #2a6fc4; --edge-dim: #183a66;
  --glow: #4cc3ff; --glow-rgb: 76 195 255; --glow-ink: #021022;
  --gold: #ffc861; --red: #ff5d6c;
  --font-display: "Rajdhani", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Exo 2", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root.pz {
  --bg: #070103; --bg-2: #3a050c;
  --panel: rgba(26, 4, 9, .9); --panel-hi: rgba(110, 10, 24, .5);
  --sunk: #120307; --fg: #ffe1e4; --muted: #c98a93;
  --edge: #b3192e; --edge-dim: #571019;
  --glow: #ff3048; --glow-rgb: 255 48 72; --glow-ink: #1a0005; --red: #ff8a95;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 60% at 50% -10%, var(--bg-2), var(--bg) 60%) fixed, var(--bg);
  color: var(--fg); font-family: var(--font-body); font-size: 15.5px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 120px; font-variant-numeric: tabular-nums;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.win {
  position: relative; background: linear-gradient(180deg, var(--panel-hi), var(--panel) 40%);
  border: 1px solid var(--edge); padding: 14px;
  box-shadow: 0 0 22px rgb(var(--glow-rgb) / .16), inset 0 0 18px rgb(var(--glow-rgb) / .06);
}
.win::before, .win::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--glow); pointer-events: none; }
.win::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.win::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.tag { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 13px; color: var(--glow); }
.title { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin: 0; text-shadow: 0 0 12px rgb(var(--glow-rgb) / .45); text-wrap: balance; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { position: relative; font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; line-height: 1; text-shadow: 0 0 14px rgb(var(--glow-rgb) / .55); }
.brand span { color: var(--glow); }
.net { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.net::before { content: ""; width: 7px; height: 7px; background: var(--muted); }
.net[data-s="ok"]::before { background: var(--glow); box-shadow: 0 0 6px var(--glow); }
.net[data-s="busy"]::before { background: var(--gold); }
.net[data-s="off"]::before { background: var(--red); }

.status-win { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.lvl { grid-row: span 3; text-align: center; border-right: 1px solid var(--edge-dim); padding-right: 16px; }
.lvl b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: .9; color: var(--glow); text-shadow: 0 0 16px rgb(var(--glow-rgb) / .6); }
.lvl small { font-family: var(--font-display); letter-spacing: .2em; font-size: 12px; color: var(--muted); }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; min-width: 0; }
.srow > span { color: var(--muted); min-width: 0; }
.srow strong { font-family: var(--font-display); font-size: 17px; letter-spacing: .04em; color: var(--fg); }
.srow .rank { color: var(--gold); }
.nm { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.xp { height: 6px; background: var(--sunk); border: 1px solid var(--edge-dim); }
.xp i { display: block; height: 100%; background: linear-gradient(90deg, var(--edge), var(--glow)); box-shadow: 0 0 10px var(--glow); }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--edge-dim); }
.tabs button { border: 0; background: none; padding: 10px 0 9px; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .05em; min-width: 0; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--glow); border-bottom-color: var(--glow); text-shadow: 0 0 10px rgb(var(--glow-rgb) / .5); }

.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.days button { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.days b { font-family: var(--font-display); font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
.days small { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.days button[aria-pressed="true"] { border-color: var(--glow); background: rgb(var(--glow-rgb) / .14); box-shadow: 0 0 12px rgb(var(--glow-rgb) / .25); }
.days button.clear b::after { content: " ✓"; color: var(--glow); font-size: 12px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.bar input[type=date] { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 6px 10px; }

.quest { display: flex; flex-direction: column; gap: 10px; }
.quest .title { font-size: 30px; line-height: 1; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.goals { display: flex; flex-direction: column; gap: 4px; margin: 2px 0; padding: 0; list-style: none; }
.goals li { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.goals li span:last-child { font-family: var(--font-display); font-weight: 600; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
.goals li.ok span:last-child { color: var(--glow); }
.goals li.ok span:first-child { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--edge); }
.clock { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid var(--edge-dim); padding-top: 10px; flex-wrap: wrap; }
.clock b { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: .06em; }
.clock span { font-family: var(--font-display); letter-spacing: .16em; font-size: 12px; color: var(--muted); text-transform: uppercase; }
.warn { margin: 0; font-size: 13.5px; color: var(--red); }
.warn b { font-family: var(--font-display); letter-spacing: .12em; }
.cleared { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .1em; color: var(--gold); text-transform: uppercase; text-shadow: 0 0 12px rgb(255 200 97 / .45); }
.cleared small { display: block; font-family: var(--font-body); font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--muted); text-shadow: none; }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 4px 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn.armed { color: var(--gold); }
.pz-badge { display: inline-block; font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; font-size: 12px; padding: 2px 8px; border: 1px solid var(--glow); color: var(--glow); text-transform: uppercase; }
.boss { display: flex; gap: 12px; align-items: center; border-color: #8a4dff; box-shadow: 0 0 22px rgb(138 77 255 / .25); }
.boss::before, .boss::after { border-color: #b98aff; }
.boss .ico { font-size: 34px; line-height: 1; filter: drop-shadow(0 0 8px rgb(185 138 255 / .7)); }
.boss .tag { color: #b98aff; }
.boss p { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
.boss b { color: var(--fg); }

.list { display: flex; flex-direction: column; gap: 12px; }
.ex { display: flex; flex-direction: column; gap: 10px; border-color: var(--edge-dim); }
.ex::before, .ex::after { border-color: var(--edge); }
.ex.complete { border-color: var(--glow); }
.ex.complete::before, .ex.complete::after { border-color: var(--gold); }
.ex-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ex-h h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .03em; line-height: 1.15; min-width: 0; }
.target { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--muted); white-space: nowrap; letter-spacing: .04em; }
.target em { font-style: normal; color: var(--glow); }
.last { margin: 0; font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.last strong { color: var(--fg); font-weight: 600; }
.chip { font-family: var(--font-display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; padding: 2px 8px; border: 1px solid var(--gold); color: var(--gold); box-shadow: 0 0 8px rgb(255 200 97 / .3); }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 24px 1fr 12px 1fr 20px; align-items: center; gap: 8px; }
.set.one { grid-template-columns: 24px 1fr 20px; }
.set .n { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 17px; text-align: center; }
.set.extra .n { color: var(--glow); }
.field { position: relative; min-width: 0; }
.field input { width: 100%; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 9px 44px 9px 11px; font-size: 19px; font-weight: 600; min-width: 0; }
.field input::placeholder { color: var(--muted); opacity: .55; font-weight: 500; }
.field input:focus { border-color: var(--glow); box-shadow: 0 0 10px rgb(var(--glow-rgb) / .3); outline: none; }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--muted); pointer-events: none; }
.x { text-align: center; color: var(--muted); }
.tick { width: 18px; height: 18px; border: 1.5px solid var(--edge-dim); transform: rotate(45deg) scale(.8); }
.set.done .tick { background: var(--glow); border-color: var(--glow); box-shadow: 0 0 8px var(--glow); }
.ex-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 7px 12px; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .06em; }
.btn:hover { border-color: var(--edge); }
.btn.primary { background: var(--glow); border-color: var(--glow); color: var(--glow-ink); }
.btn.armed { border-color: var(--gold); color: var(--gold); }
.cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.derived { margin: 0; font-size: 13.5px; color: var(--muted); }
.derived strong { color: var(--fg); }
.add select { width: 100%; border: 1px dashed var(--edge); background: var(--sunk); padding: 11px 12px; color: var(--fg); }
.sect { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .16em; font-size: 14px; color: var(--glow); margin: 6px 0 -4px; display: flex; justify-content: space-between; gap: 10px; }
.sect small { color: var(--muted); letter-spacing: .06em; font-weight: 600; }
.note { border-left: 2px solid var(--glow); padding: 4px 0 4px 12px; font-size: 13.5px; color: var(--muted); margin: 0; }
.note b { color: var(--fg); }
.note.alert { border-left-color: var(--gold); }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; }

/* badges and rarity */
.badge { --rc: #9fb3cc; display: inline-grid; place-items: center; width: 34px; height: 34px; flex: none; font-size: 18px; line-height: 1;
  border: 1.5px solid var(--rc); background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 28%, transparent), var(--sunk) 70%);
  box-shadow: 0 0 10px color-mix(in srgb, var(--rc) 45%, transparent); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.badge.sm { width: 24px; height: 24px; font-size: 13px; }
.badge.lg { width: 64px; height: 64px; font-size: 32px; }
.badge.locked { filter: grayscale(1) brightness(.45); box-shadow: none; }
.rar { font-family: var(--font-display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 11.5px; }

/* board */
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 30px auto 1fr auto; gap: 4px 10px; align-items: center; border: 1px solid var(--edge-dim); background: var(--panel); padding: 10px 12px; text-align: left; width: 100%; }
.row.me { border-color: var(--glow); box-shadow: 0 0 14px rgb(var(--glow-rgb) / .2); }
.row .pos { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--muted); text-align: center; grid-row: span 2; }
.row:first-child .pos { color: var(--gold); text-shadow: 0 0 10px rgb(255 200 97 / .5); }
.row .badge { grid-row: span 2; }
.row .who { min-width: 0; }
.row .who b { display: block; font-family: var(--font-display); font-size: 19px; letter-spacing: .04em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .who small { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .lv { text-align: right; font-family: var(--font-display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.row .lv small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); }
.row .meta { grid-column: 3 / span 2; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.st { font-family: var(--font-display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 11.5px; padding: 1px 7px; border: 1px solid var(--edge-dim); }
.st.ok { border-color: var(--glow); color: var(--glow); }
.st.pz { border-color: #ff3048; color: #ff3048; box-shadow: 0 0 8px rgb(255 48 72 / .4); }
.st.ex { border-color: var(--muted); }
.feed { display: flex; flex-direction: column; border: 1px solid var(--edge-dim); background: var(--panel); }
.feed div { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--edge-dim); font-size: 14px; }
.feed div:first-child { border-top: 0; }
.feed time { font-size: 12px; color: var(--muted); white-space: nowrap; }
.feed .ic { width: 24px; text-align: center; }

/* profile */
.phead { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
.phead .badge { grid-row: span 3; }
.phead h1 { margin: 0; font-family: var(--font-display); font-size: 30px; letter-spacing: .06em; line-height: 1; text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
.phead .ttl { font-size: 13.5px; }
.statgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 14px; }
.stat2 { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; font-family: var(--font-display); font-weight: 700; }
.stat2 span { letter-spacing: .1em; color: var(--muted); }
.stat2 b { font-size: 20px; }
.stat2 .meter { height: 5px; background: var(--sunk); border: 1px solid var(--edge-dim); }
.stat2 .meter i { display: block; height: 100%; background: var(--glow); box-shadow: 0 0 8px var(--glow); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.num { border: 1px solid var(--edge-dim); background: var(--panel); padding: 9px 10px; min-width: 0; }
.num b { display: block; font-family: var(--font-display); font-size: 22px; line-height: 1; color: var(--glow); }
.num small { color: var(--muted); font-size: 11.5px; }
.titlepick select { width: 100%; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 9px 12px; }
details.cat { border: 1px solid var(--edge-dim); background: var(--panel); }
details.cat > summary { list-style: none; cursor: pointer; padding: 11px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; }
details.cat > summary::-webkit-details-marker { display: none; }
.cat .cn { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; }
.cat .cc { font-family: var(--font-display); font-weight: 600; color: var(--muted); }
.cat .nx { grid-column: 2 / span 2; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.cat .nx .meter { flex: 1; height: 4px; background: var(--sunk); border: 1px solid var(--edge-dim); min-width: 40px; }
.cat .nx .meter i { display: block; height: 100%; background: var(--glow); }
.achs { display: flex; flex-direction: column; border-top: 1px solid var(--edge-dim); }
.ach { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--edge-dim); }
.ach:first-child { border-top: 0; }
.ach b { font-size: 14.5px; }
.ach small { display: block; color: var(--muted); font-size: 12px; }
.ach .when { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.ach.lock b { color: var(--muted); }
details.hist { border: 1px solid var(--edge-dim); background: var(--panel); }
details.hist summary { list-style: none; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; cursor: pointer; }
details.hist summary::-webkit-details-marker { display: none; }
.hn { font-weight: 600; min-width: 0; }
.hs { font-size: 13px; color: var(--muted); }
.hs .pos { color: var(--glow); font-weight: 600; }
.spark { grid-row: 1 / span 2; grid-column: 2; }
.spark path.l { fill: none; stroke: var(--glow); stroke-width: 2; }
.spark path.a { fill: rgb(var(--glow-rgb) / .14); }
.spark circle { fill: var(--glow); }
.hist .scroll { overflow-x: auto; }
.hist table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.hist td, .hist th { padding: 7px 14px; border-top: 1px solid var(--edge-dim); vertical-align: top; text-align: left; white-space: nowrap; }
.hist th { font-family: var(--font-display); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--muted); font-weight: 600; }
.hist td:first-child { color: var(--muted); width: 1%; }

.card { display: flex; flex-direction: column; gap: 10px; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 19px; letter-spacing: .08em; text-transform: uppercase; }
.card p { margin: 0; font-size: 14px; color: var(--muted); }
.card textarea { width: 100%; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 9px 12px; min-height: 120px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
.file { position: relative; overflow: hidden; display: inline-flex; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* login */
.login { max-width: 460px; margin: 6vh auto 0; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1; }
.login .brand { font-size: 34px; text-align: center; }
.login .who { display: flex; flex-direction: column; gap: 8px; }
.login .who button { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--edge); background: var(--sunk); padding: 12px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .06em; }
.login .who button small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12.5px; color: var(--muted); letter-spacing: 0; }
.login .new { display: flex; gap: 8px; }
.login .new input { flex: 1; min-width: 0; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 11px 12px; font-size: 17px; }

.timer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(4, 8, 18, .96); border-top: 1px solid var(--glow); box-shadow: 0 -6px 24px rgb(var(--glow-rgb) / .25);
}
.timer-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.timer-t { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; min-width: 70px; color: var(--glow); }
.timer-l { flex: 1; font-size: 13px; color: var(--muted); min-width: 0; }
.timer.over { border-top-color: var(--gold); }
.timer.over .timer-t { color: var(--gold); }
.toast, .update {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30;
  width: min(calc(100vw - 32px), 420px); text-align: center;
}
.toast .badge { margin: 4px auto 0; display: grid; }
.toast .title { font-size: 24px; color: var(--gold); text-shadow: 0 0 14px rgb(255 200 97 / .6); }
.toast p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.update { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .1em; text-transform: uppercase; color: var(--glow); cursor: pointer; z-index: 29; }
.update small { display: block; font-family: var(--font-body); font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--muted); }

#cracks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; display: none; }
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 4; display: none; box-shadow: inset 0 0 90px 24px rgb(255 20 40 / .32); }
:root.pz #cracks, :root.pz .vignette { display: block; }
:root.pz .brand::before, :root.pz .brand::after { content: attr(data-text); position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; }
:root.pz .brand::before { color: #ff2a3d; clip-path: inset(0 0 100% 0); }
:root.pz .brand::after { color: #6fe0ff; opacity: .7; clip-path: inset(0 0 100% 0); }
@media (prefers-reduced-motion: no-preference) {
  .ex, .set .tick { transition: border-color .2s, background .2s, box-shadow .2s; }
  .pop { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateX(-50%) scale(.94); opacity: .4; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  :root.pz .vignette { animation: throb 3.2s ease-in-out infinite; }
  @keyframes throb { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
  :root.pz .brand::before { animation: g1 2.6s infinite steps(1); }
  :root.pz .brand::after { animation: g2 3.3s infinite steps(1); }
  @keyframes g1 { 0%, 86%, 100% { transform: none; clip-path: inset(0 0 100% 0); } 87% { transform: translate(3px, -1px); clip-path: inset(10% 0 55% 0); } 90% { transform: translate(-4px, 1px); clip-path: inset(60% 0 8% 0); } 93% { transform: translate(2px, 0); clip-path: inset(30% 0 40% 0); } }
  @keyframes g2 { 0%, 80%, 100% { transform: none; clip-path: inset(0 0 100% 0); } 81% { transform: translate(-3px, 1px); clip-path: inset(50% 0 20% 0); } 84% { transform: translate(3px, 0); clip-path: inset(5% 0 70% 0); } }
  :root.pz .quest .title { animation: shake 6s infinite; }
  @keyframes shake { 0%, 94%, 100% { transform: none; } 95% { transform: translate(-2px, 1px) skewX(-4deg); } 96% { transform: translate(3px, -1px) skewX(3deg); } 97% { transform: translate(-1px, 0); } }
}

/* rotating warning glitch */
#warnTxt { display: inline; }
#warnTxt.gl { display: inline-block; animation: wg .46s steps(7); }
@keyframes wg { 0% { transform: none; } 15% { transform: translate(-3px, 0) skewX(-10deg); text-shadow: 2px 0 #ff2a3d, -2px 0 #6fe0ff; clip-path: inset(0 0 55% 0); }
  30% { transform: translate(4px, 0); clip-path: inset(40% 0 10% 0); opacity: .5; } 45% { transform: translate(-2px, 1px); clip-path: inset(10% 0 60% 0); text-shadow: -2px 0 #ff2a3d, 2px 0 #6fe0ff; }
  60% { transform: translate(2px, 0); clip-path: inset(60% 0 0 0); opacity: .7; } 80% { transform: translate(-1px, 0); clip-path: none; } 100% { transform: none; opacity: 1; } }
/* program editor */
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-family: var(--font-display); letter-spacing: .08em; text-transform: uppercase; min-width: 0; }
.pgrid label.wide { grid-column: 1 / -1; }
.pgrid input, .pgrid select { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 9px 11px; font-family: var(--font-body); font-size: 16px; letter-spacing: 0; text-transform: none; color: var(--fg); min-width: 0; width: 100%; }
.floor { margin: 0; font-size: 13.5px; padding: 6px 10px; border: 1px solid var(--edge-dim); }
.floor.ok { border-color: var(--glow); color: var(--glow); }
.floor.bad { border-color: var(--gold); color: var(--gold); }
.prows { display: flex; flex-direction: column; gap: 8px; }
.prow { border: 1px solid var(--edge-dim); background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.pn b { display: block; font-family: var(--font-display); font-size: 18px; letter-spacing: .03em; }
.pn small { color: var(--muted); font-size: 12px; }
.pc { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.step { display: inline-flex; align-items: center; gap: 8px; }
.step b { font-family: var(--font-display); font-size: 20px; min-width: 18px; text-align: center; }
.step .btn, .mv .btn { padding: 4px 11px; }
.rng { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.rng input { width: 52px; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 6px 6px; text-align: center; font-size: 16px; }
.mv { display: inline-flex; gap: 4px; }
.psum { display: flex; flex-direction: column; }
.psum div { display: grid; grid-template-columns: 44px 1fr; gap: 0 10px; padding: 6px 0; border-top: 1px solid var(--edge-dim); }
.psum div:first-child { border-top: 0; }

.psum small { color: var(--muted); font-size: 12px; min-width: 0; }
.mrow { display: inline-flex; gap: 3px; }

    let maxT = S.since, changed = false;

    for (const h of await hr.json()) {
      if (!S.outbox.h[h.id]) { S.hunters[h.id] = { id: h.id, name: h.name, title: h.title || null, program: h.program || (S.hunters[h.id] && S.hunters[h.id].program) || null }; changed = true; }

      if (!r.ok) throw r.status;
      const rows = await r.json();
      for (const row of rows) {

        if (!maxT || row.updated_at > maxT) maxT = row.updated_at;

    const qx = S.sinceX ? `&updated_at=gt.${encodeURIComponent(S.sinceX)}` : "";

function login(id) {
  const nm = nameOf(id).toLowerCase();

      if (!S.sessions[nk]) { S.sessions[nk] = { ...b, profile: id }; S.outbox.s[nk] = rnd(); }
      delete S.sessions[k]; delete S.outbox.s[k];
    }
    delete S.hunters[h.id];
  }
  S.me = id; S.view = "log"; S.viewing = null; S.seen = null; S.ver++;
  for (const h of Object.values(S.hunters)) if (h.local && (h.id === id || Object.values(S.sessions).some(b => b.profile === h.id))) { delete h.local; dirtyHunter(h.id); }

function machineLog(id) {
  const mine = Object.values(S.sessions).filter(b => b.profile === id && !isEmpty(b)).sort((a, b) => a.date < b.date ? -1 : 1);
  let h = "";
  const cardio = mine.filter(b => { const c = cardioOf(b); return c.total || c.dist; });
  if (cardio.length) {
    const rows = cardio.map(b => ({ b, c: cardioOf(b) })), z = rows[rows.length - 1].c;
    h += `<details class="hist"><summary><span class="hn">Walk and run</span>${spark(rows.filter(r => r.c.dist).map(r => r.c.dist))}<span class="hs">${rows.length} sessions · last ${z.dist ? z.dist + " km" : Math.round(z.total) + " min"}${pace(z) ? " at " + paceTxt(pace(z)) : ""}</span></summary>
      <div class="scroll"><table><tr><th>Date</th><th>Walk</th><th>Run</th><th>Km</th><th>Pace</th><th>Kcal</th></tr>${rows.slice(-10).reverse().map(({ b, c }) =>
        `<tr><td>${fmtDate(b.date)}</td><td>${c.walk ?? ""}</td><td>${c.run ?? (c.walk == null ? Math.round(c.total) : "")}</td><td>${c.dist ?? ""}</td><td>${paceTxt(pace(c))}</td><td>${c.kcal ?? ""}</td></tr>`).join("")}</table></div></details>`;
  }
  const ids = new Set(); for (const b of mine) for (const k of Object.keys(b.ex || {})) ids.add(k);
  for (const eid of [...ids].sort((a, b) => (CX(a) ? CX(a).name : a).localeCompare(CX(b) ? CX(b).name : b))) {
    const type = typeOf(eid), key = type === "wr" ? "w" : type, pts = [];
    for (const b of mine) {
      const arr = ((b.ex || {})[eid] || []).filter(s => setOk(type, s)); if (!arr.length) continue;
      const top = Math.max(...arr.map(s => +s[key] || 0));
      pts.push({ date: b.date, top, reps: type === "wr" ? arr.find(s => (+s.w || 0) === top).r : null, sets: arr });
    }
    if (!pts.length) continue;
    const a = pts[0], z = pts[pts.length - 1], diff = z.top - a.top, u = type === "wr" ? " kg" : type === "s" ? " s" : " reps";
    const trend = pts.length > 1 ? (diff > 0 ? `<span class="pos">+${+diff.toFixed(1)}${u}</span> since ${fmtShort(a.date)}` : diff < 0 ? `${+diff.toFixed(1)}${u} since ${fmtShort(a.date)}` : `Same top since ${fmtShort(a.date)}`) : `First logged ${fmtShort(a.date)}`;
    h += `<details class="hist"><summary><span class="hn">${esc(CX(eid) ? CX(eid).name : eid)}</span>${spark(pts.map(p => p.top))}<span class="hs">Top ${type === "wr" ? `${wTxt(z.top)}${z.top ? " kg" : ""} × ${z.reps ?? "?"}` : z.top + u} · ${trend}</span></summary>
      <div class="scroll"><table>${pts.slice(-8).reverse().map(p => `<tr><td>${fmtDate(p.date)}</td><td>${p.sets.map(s => setTxt(s, type)).join(" · ")}</td></tr>`).join("")}</table></div></details>`;
  }
  return h || `<div class="win empty">No sessions logged yet.</div>`;
}

/* ================= PENALTY ZONE CRACKS ================= */
const Cracks = (() => {
  const cv = $("#cracks"), ctx = cv.getContext("2d");
  let segs = [], raf = 0, t0 = 0, on = false, w = 0, h = 0, lastDraw = 0;
  function grow(x, y, ang, len, width, depth, delay) {
    const pts = [[x, y]]; let l = 0;
    while (l < len) {
      const step = 5 + Math.random() * 9;
      ang += (Math.random() - .5) * .9;
      x += Math.cos(ang) * step; y += Math.sin(ang) * step; l += step; pts.push([x, y]);
      if (depth < 2 && Math.random() < .14) grow(x, y, ang + (Math.random() < .5 ? -1 : 1) * (.5 + Math.random() * .7), (len - l) * .6, width * .6, depth + 1, delay + .25 + l / len * 1.2);
    }
    if (pts.length > 1) segs.push({ pts, width, delay });
  }
  function build() {
    const dpr = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    segs = [];
    const n = Math.round((w + h) / 80), reach = Math.min(w, h) * .15;
    for (let i = 0; i < n; i++) {
      const side = i % 4; let x, y, a;
      if (side === 0) { x = Math.random() * w; y = 0; a = Math.PI / 2; }
      else if (side === 1) { x = w; y = Math.random() * h; a = Math.PI; }
      else if (side === 2) { x = Math.random() * w; y = h; a = -Math.PI / 2; }
      else { x = 0; y = Math.random() * h; a = 0; }
      grow(x, y, a + (Math.random() - .5) * .8, 30 + Math.random() * reach, 2.4, 0, Math.random() * 1.6);
    }
  }
  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    const flicker = reduced ? 1 : (.72 + .28 * Math.sin(t * 2.3)) * (Math.random() < .03 ? .35 : 1);
    const glitch = !reduced && (t % 4.5) < .12;
    ctx.save();
    if (glitch) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 3);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const s of segs) {
      const prog = reduced ? 1 : Math.max(0, Math.min(1, (t - s.delay) / 1.6));
      if (!prog) continue;
      const k = Math.max(2, Math.ceil(s.pts.length * prog));
      ctx.beginPath(); ctx.moveTo(s.pts[0][0], s.pts[0][1]);
      for (let i = 1; i < k; i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
      ctx.shadowColor = "rgba(255,30,50,.9)"; ctx.shadowBlur = 10;
      ctx.strokeStyle = `rgba(255,48,72,${.75 * flicker})`; ctx.lineWidth = s.width; ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = `rgba(255,220,225,${.55 * flicker})`; ctx.lineWidth = Math.max(.6, s.width * .3); ctx.stroke();
    }
    if (glitch) { ctx.fillStyle = "rgba(255,40,60,.12)"; ctx.fillRect(0, Math.random() * h, w, 2 + Math.random() * 8); }
    ctx.restore();
  }
  function loop(now) {
    if (!on) return;
    raf = requestAnimationFrame(loop);
    if (document.hidden || now - lastDraw < 33) return;
    lastDraw = now; draw((now - t0) / 1000);
  }
  addEventListener("resize", () => { if (on) { build(); if (reduced) draw(0); } });
  return {
    start() { if (on) return; on = true; build(); t0 = performance.now(); if (reduced) draw(0); else raf = requestAnimationFrame(loop); },
    stop() { on = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, cv.width, cv.height); }
  };
})();

/* ================= REST TIMER ================= */
let tEnd = 0, tInt = null, tDone = false;
function startTimer(sec, label) {
  tEnd = Date.now() + sec * 1000; tDone = false;
  $("#timerL").textContent = `Recovering after ${label}`;
  $("#timer").hidden = false; $("#timer").classList.remove("over");
  clearInterval(tInt); tick(); tInt = setInterval(tick, 250);
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
}
function tick() {
  const left = Math.ceil((tEnd - Date.now()) / 1000);
  if (left <= 0) {
    $("#timerT").textContent = "GO";
    if (!tDone) { tDone = true; $("#timer").classList.add("over"); $("#timerL").textContent = "Stamina restored. Next set."; chime("pr"); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
    return;
  }
  $("#timerT").textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
}
$("#timerAdd").onclick = () => { if (tDone) { tEnd = Date.now(); tDone = false; $("#timer").classList.remove("over"); } tEnd += 15000; tick(); };
$("#timerStop").onclick = () => { clearInterval(tInt); $("#timer").hidden = true; };

/* ================= EXPORT / BACKUP ================= */
const backupJson = () => JSON.stringify({ app: "lift-log", version: 5, exported: new Date().toISOString(), hunters: S.hunters, custom: S.custom, sessions: S.sessions }, null, 1);
function csvText() {
  const q = v => v == null ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const head = ["type", "person", "date", "day", "penalty_day", "quest_cleared", "excused", "item", "category", "stat", "in_plan", "set", "weight_kg", "reps", "seconds", "walk_min", "run_min", "total_min", "distance_km", "pace_min_per_km", "kcal"];
  const rows = [head];
  const R = replay(S.me), who = nameOf(S.me);
  const mine = Object.values(S.sessions).filter(b => b.profile === S.me).sort((a, b) => a.date < b.date ? -1 : 1);
  const row = o => rows.push(head.map(k => o[k] ?? ""));
  for (const b of mine) {
    const plan = planFor(S.me, b.day, b), planIds = new Set(plan.ex.map(e => e[0]));
    const base = { person: who, date: b.date, day: plan.name, penalty_day: R.pen[b.date] ? "yes" : "no", quest_cleared: questDone(b, !!R.pen[b.date]) ? "yes" : "no", excused: b.excused ? "yes" : "no" };
    const c = cardioOf(b);
    if (c.total || c.dist || c.kcal) row({ ...base, type: "cardio", item: "walk/run", category: "Program cardio", stat: "VIT", in_plan: "yes", walk_min: c.walk, run_min: c.run, total_min: c.total, distance_km: c.dist, pace_min_per_km: pace(c) ? pace(c).toFixed(2) : "", kcal: c.kcal });
    for (const [id, arr] of Object.entries(b.ex || {})) {
      const L = CX(id) || { name: id, cat: "", stat: "", type: "wr" };
      arr.forEach((s, i) => { if (setOk(L.type, s)) row({ ...base, type: "lift", item: L.name, category: L.cat, stat: L.stat, in_plan: planIds.has(id) ? "yes" : "no", set: i + 1, weight_kg: s.w, reps: s.r, seconds: s.s }); });
    }
    for (const e of b.bonus || []) {
      const L = CX(e.id); if (!L || !bonusLogged(e)) continue;
      if (L.type === "min") row({ ...base, type: "bonus", item: L.name, category: L.cat, stat: L.stat, in_plan: "no", total_min: e.min, distance_km: e.km });
      else (e.sets || []).forEach((s, i) => { if (setOk(L.type, s)) row({ ...base, type: "bonus", item: L.name, category: L.cat, stat: L.stat, in_plan: "no", set: i + 1, weight_kg: s.w, reps: s.r, seconds: s.s }); });
    }
    if (b.excused && !hasTraining({ ...b, excused: false })) row({ ...base, type: "excused" });
  }
  return rows.map(r => r.map(q).join(",")).join("\n");
}
function save(name, text, type) {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch (e) { doCopy(text); }
}
const doExport = () => save(`solo-lifting-backup-${todayStr()}.json`, backupJson(), "application/json");
const doCsv = () => save(`solo-lifting-${nameOf(S.me).toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${todayStr()}.csv`, csvText(), "text/csv");
async function doCopy(text) {
  const ta = $("#exportText"); if (!ta) return; ta.hidden = false; ta.value = text;
  try { await navigator.clipboard.writeText(text); $("#copyBtn").textContent = "Copied"; }
  catch (e) { ta.focus(); ta.select(); $("#copyBtn").textContent = "Select all and copy"; }
}
async function doImport(file) {
  const msg = $("#importMsg"); msg.hidden = false;
  try {
    const o = JSON.parse(await file.text());
    if (!o || o.app !== "lift-log" || typeof o.sessions !== "object") throw new Error("bad");
    let n = 0;
    for (const [id, x] of Object.entries(o.custom || {})) if (!S.custom[id]) { S.custom[id] = x; S.outbox.x[id] = rnd(); CATALOGUE = null; }
    for (const [k, b] of Object.entries(o.sessions)) {
      if (!/^[a-z0-9]+_\d{4}-\d{2}-\d{2}_(UA|LA|UB|LB|FR|WK)$/.test(k) || !b) continue;
      const cur = S.sessions[k];
      if (!cur || (b.ts || 0) > (cur.ts || 0)) { S.sessions[k] = b; S.outbox.s[k] = rnd(); n++; }
    }
    const hs = o.hunters || Object.fromEntries(Object.entries(o.names || {}).map(([id, name]) => [id, { id, name, title: null }]));
    for (const [id, h] of Object.entries(hs)) if (!S.hunters[id]) { S.hunters[id] = { id, name: h.name || "Hunter", title: h.title || null, program: h.program || null }; S.outbox.h[id] = rnd(); }
    for (const b of Object.values(S.sessions)) if (!S.hunters[b.profile]) { S.hunters[b.profile] = { id: b.profile, name: "Hunter", title: null }; S.outbox.h[b.profile] = rnd(); }
    S.ver++; persist(); pushSoon(); render();
    const m2 = $("#importMsg"); if (m2) { m2.hidden = false; m2.textContent = `Restored ${n} session${n === 1 ? "" : "s"}.`; }
  } catch (e) { msg.textContent = "That file couldn't be read. Choose a .json file made with Export backup."; }
}

/* ================= START ================= */
load();
S.date = todayStr(); S.day = dayForDate(S.date); S.openedOn = S.date;
render();
syncNow();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ("serviceWorker" in navigator) addEventListener("load", async () => {
  try {
    const hadController = !!navigator.serviceWorker.controller;
    const reg = await navigator.serviceWorker.register("sw.js");
    const bar = $("#updateBar");
    const offer = w => { bar.hidden = false; bar.onclick = () => { bar.firstChild.nodeValue = "Updating"; w.postMessage("skip"); }; };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => { const w = reg.installing; if (w) w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) offer(w); }); });
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; persistNow(); location.reload(); } });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
  } catch (e) {}
});
</script>
