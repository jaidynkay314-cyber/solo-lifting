<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="description" content="Daily quest gym tracker">
<title>Solo Lifting</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solo Lifting">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600&display=swap">
<style>
/* Layout: one-column "system window" HUD. Dark-only by design; a missed quest flips the palette to the red Penalty Zone. */
:root {
  --bg: #04060c; --bg-2: #0a1530;
  --panel: rgba(9, 18, 38, .88); --panel-hi: rgba(22, 46, 92, .55);
  --sunk: #08111f; --fg: #dbe8ff; --muted: #7f96bd;
  --edge: #2a6fc4; --edge-dim: #183a66;
  --glow: #4cc3ff; --glow-rgb: 76 195 255; --glow-ink: #021022;
  --gold: #ffc861; --red: #ff5d6c;
  --font-display: "Rajdhani", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Exo 2", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root.pz {
  --bg: #070103; --bg-2: #3a050c;
  --panel: rgba(26, 4, 9, .9); --panel-hi: rgba(110, 10, 24, .5);
  --sunk: #120307; --fg: #ffe1e4; --muted: #c98a93;
  --edge: #b3192e; --edge-dim: #571019;
  --glow: #ff3048; --glow-rgb: 255 48 72; --glow-ink: #1a0005; --red: #ff8a95;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 60% at 50% -10%, var(--bg-2), var(--bg) 60%) fixed, var(--bg);
  color: var(--fg); font-family: var(--font-body); font-size: 15.5px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 120px; font-variant-numeric: tabular-nums;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.win {
  position: relative; background: linear-gradient(180deg, var(--panel-hi), var(--panel) 40%);
  border: 1px solid var(--edge); padding: 14px;
  box-shadow: 0 0 22px rgb(var(--glow-rgb) / .16), inset 0 0 18px rgb(var(--glow-rgb) / .06);
}
.win::before, .win::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--glow); pointer-events: none; }
.win::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.win::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.tag { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 13px; color: var(--glow); }
.title { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin: 0; text-shadow: 0 0 12px rgb(var(--glow-rgb) / .45); text-wrap: balance; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { position: relative; font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; line-height: 1; text-shadow: 0 0 14px rgb(var(--glow-rgb) / .55); }
.brand span { color: var(--glow); }
.net { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.net::before { content: ""; width: 7px; height: 7px; background: var(--muted); }
.net[data-s="ok"]::before { background: var(--glow); box-shadow: 0 0 6px var(--glow); }
.net[data-s="busy"]::before { background: var(--gold); }
.net[data-s="off"]::before { background: var(--red); }

.status-win { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.lvl { grid-row: span 3; text-align: center; border-right: 1px solid var(--edge-dim); padding-right: 16px; }
.lvl b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: .9; color: var(--glow); text-shadow: 0 0 16px rgb(var(--glow-rgb) / .6); }
.lvl small { font-family: var(--font-display); letter-spacing: .2em; font-size: 12px; color: var(--muted); }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; min-width: 0; }
.srow > span { color: var(--muted); min-width: 0; }
.srow strong { font-family: var(--font-display); font-size: 17px; letter-spacing: .04em; color: var(--fg); }
.srow .rank { color: var(--gold); }
.nm { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.xp { height: 6px; background: var(--sunk); border: 1px solid var(--edge-dim); }
.xp i { display: block; height: 100%; background: linear-gradient(90deg, var(--edge), var(--glow)); box-shadow: 0 0 10px var(--glow); }

.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--edge-dim); }
.tabs button { position: relative; border: 0; background: none; padding: 10px 0 9px; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .05em; min-width: 0; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--glow); border-bottom-color: var(--glow); text-shadow: 0 0 10px rgb(var(--glow-rgb) / .5); }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.days button { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.days b { font-family: var(--font-display); font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
.days small { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.days button[aria-pressed="true"] { border-color: var(--glow); background: rgb(var(--glow-rgb) / .14); box-shadow: 0 0 12px rgb(var(--glow-rgb) / .25); }
.days button.clear b::after { content: " ✓"; color: var(--glow); font-size: 12px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.bar input[type=date] { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 6px 10px; }

.quest { display: flex; flex-direction: column; gap: 10px; }
.quest .title { font-size: 30px; line-height: 1; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.goals { display: flex; flex-direction: column; gap: 4px; margin: 2px 0; padding: 0; list-style: none; }
.goals li { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.goals li span:last-child { font-family: var(--font-display); font-weight: 600; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
.goals li.ok span:last-child { color: var(--glow); }
.goals li.ok span:first-child { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--edge); }
.clock { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid var(--edge-dim); padding-top: 10px; flex-wrap: wrap; }
.clock b { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: .06em; }
.clock span { font-family: var(--font-display); letter-spacing: .16em; font-size: 12px; color: var(--muted); text-transform: uppercase; }
.warn { margin: 0; font-size: 13.5px; color: var(--red); }
.warn b { font-family: var(--font-display); letter-spacing: .12em; }
.cleared { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .1em; color: var(--gold); text-transform: uppercase; text-shadow: 0 0 12px rgb(255 200 97 / .45); }
.cleared small { display: block; font-family: var(--font-body); font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--muted); text-shadow: none; }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 4px 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn.armed { color: var(--gold); }
.pz-badge { display: inline-block; font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; font-size: 12px; padding: 2px 8px; border: 1px solid var(--glow); color: var(--glow); text-transform: uppercase; }
.boss { display: flex; gap: 12px; align-items: center; border-color: #8a4dff; box-shadow: 0 0 22px rgb(138 77 255 / .25); }
.boss::before, .boss::after { border-color: #b98aff; }
.boss .ico { font-size: 34px; line-height: 1; filter: drop-shadow(0 0 8px rgb(185 138 255 / .7)); }
.boss .tag { color: #b98aff; }
.boss p { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
.boss b { color: var(--fg); }

.list { display: flex; flex-direction: column; gap: 12px; }
.ex { display: flex; flex-direction: column; gap: 10px; border-color: var(--edge-dim); }
.ex::before, .ex::after { border-color: var(--edge); }
.ex.complete { border-color: var(--glow); }
.ex.complete::before, .ex.complete::after { border-color: var(--gold); }
.ex-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ex-h h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .03em; line-height: 1.15; min-width: 0; }
.target { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--muted); white-space: nowrap; letter-spacing: .04em; }
.target em { font-style: normal; color: var(--glow); }
.last { margin: 0; font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.last strong { color: var(--fg); font-weight: 600; }
.chip { font-family: var(--font-display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; padding: 2px 8px; border: 1px solid var(--gold); color: var(--gold); box-shadow: 0 0 8px rgb(255 200 97 / .3); }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 24px 1fr 12px 1fr 20px; align-items: center; gap: 8px; }
.set.one { grid-template-columns: 24px 1fr 20px; }
.set .n { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 17px; text-align: center; }
.set.extra .n { color: var(--glow); }
.field { position: relative; min-width: 0; }
.field input { width: 100%; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 9px 44px 9px 11px; font-size: 19px; font-weight: 600; min-width: 0; }
.field input::placeholder { color: var(--muted); opacity: .55; font-weight: 500; }
.field input:focus { border-color: var(--glow); box-shadow: 0 0 10px rgb(var(--glow-rgb) / .3); outline: none; }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--muted); pointer-events: none; }
.x { text-align: center; color: var(--muted); }
.tick { width: 18px; height: 18px; border: 1.5px solid var(--edge-dim); transform: rotate(45deg) scale(.8); }
.set.done .tick { background: var(--glow); border-color: var(--glow); box-shadow: 0 0 8px var(--glow); }
.ex-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 7px 12px; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .06em; }
.btn:hover { border-color: var(--edge); }
.btn.primary { background: var(--glow); border-color: var(--glow); color: var(--glow-ink); }
.btn.armed { border-color: var(--gold); color: var(--gold); }
.cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.derived { margin: 0; font-size: 13.5px; color: var(--muted); }
.derived strong { color: var(--fg); }
.add select { width: 100%; border: 1px dashed var(--edge); background: var(--sunk); padding: 11px 12px; color: var(--fg); }
.sect { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .16em; font-size: 14px; color: var(--glow); margin: 6px 0 -4px; display: flex; justify-content: space-between; gap: 10px; }
.sect small { color: var(--muted); letter-spacing: .06em; font-weight: 600; }
.note { border-left: 2px solid var(--glow); padding: 4px 0 4px 12px; font-size: 13.5px; color: var(--muted); margin: 0; }
.note b { color: var(--fg); }
.note.alert { border-left-color: var(--gold); }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; }

/* badges and rarity */
.badge { --rc: #9fb3cc; display: inline-grid; place-items: center; width: 34px; height: 34px; flex: none; font-size: 18px; line-height: 1;
  border: 1.5px solid var(--rc); background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 28%, transparent), var(--sunk) 70%);
  box-shadow: 0 0 10px color-mix(in srgb, var(--rc) 45%, transparent); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.badge.sm { width: 24px; height: 24px; font-size: 13px; }
.badge.lg { width: 64px; height: 64px; font-size: 32px; }
.badge.locked { filter: grayscale(1) brightness(.45); box-shadow: none; }
.rar { font-family: var(--font-display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 11.5px; }

/* board */
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 30px auto 1fr auto; gap: 4px 10px; align-items: center; border: 1px solid var(--edge-dim); background: var(--panel); padding: 10px 12px; text-align: left; width: 100%; }
.row.me { border-color: var(--glow); box-shadow: 0 0 14px rgb(var(--glow-rgb) / .2); }
.row .pos { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--muted); text-align: center; grid-row: span 2; }
.row:first-child .pos { color: var(--gold); text-shadow: 0 0 10px rgb(255 200 97 / .5); }
.row .badge { grid-row: span 2; }
.row .who { min-width: 0; }
.row .who b { display: block; font-family: var(--font-display); font-size: 19px; letter-spacing: .04em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .who small { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .lv { text-align: right; font-family: var(--font-display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.row .lv small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); }
.row .meta { grid-column: 3 / span 2; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.st { font-family: var(--font-display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 11.5px; padding: 1px 7px; border: 1px solid var(--edge-dim); }
.st.ok { border-color: var(--glow); color: var(--glow); }
.st.pz { border-color: #ff3048; color: #ff3048; box-shadow: 0 0 8px rgb(255 48 72 / .4); }
.st.ex { border-color: var(--muted); }
.feed { display: flex; flex-direction: column; border: 1px solid var(--edge-dim); background: var(--panel); }
.feed div { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--edge-dim); font-size: 14px; }
.feed div:first-child { border-top: 0; }
.feed time { font-size: 12px; color: var(--muted); white-space: nowrap; }
.feed .ic { width: 24px; text-align: center; }

/* profile */
.phead { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
.phead .badge { grid-row: span 3; }
.phead h1 { margin: 0; font-family: var(--font-display); font-size: 30px; letter-spacing: .06em; line-height: 1; text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
.phead .ttl { font-size: 13.5px; }
.statgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 14px; }
.stat2 { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; font-family: var(--font-display); font-weight: 700; }
.stat2 span { letter-spacing: .1em; color: var(--muted); }
.stat2 b { font-size: 20px; }
.stat2 .meter { height: 5px; background: var(--sunk); border: 1px solid var(--edge-dim); }
.stat2 .meter i { display: block; height: 100%; background: var(--glow); box-shadow: 0 0 8px var(--glow); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.num { border: 1px solid var(--edge-dim); background: var(--panel); padding: 9px 10px; min-width: 0; }
.num b { display: block; font-family: var(--font-display); font-size: 22px; line-height: 1; color: var(--glow); }
.num small { color: var(--muted); font-size: 11.5px; }
.titlepick select { width: 100%; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 9px 12px; }
details.cat { border: 1px solid var(--edge-dim); background: var(--panel); }
details.cat > summary { list-style: none; cursor: pointer; padding: 11px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; }
details.cat > summary::-webkit-details-marker { display: none; }
.cat .cn { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; }
.cat .cc { font-family: var(--font-display); font-weight: 600; color: var(--muted); }
.cat .nx { grid-column: 2 / span 2; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.cat .nx .meter { flex: 1; height: 4px; background: var(--sunk); border: 1px solid var(--edge-dim); min-width: 40px; }
.cat .nx .meter i { display: block; height: 100%; background: var(--glow); }
.achs { display: flex; flex-direction: column; border-top: 1px solid var(--edge-dim); }
.ach { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--edge-dim); }
.ach:first-child { border-top: 0; }
.ach b { font-size: 14.5px; }
.ach small { display: block; color: var(--muted); font-size: 12px; }
.ach .when { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.ach.lock b { color: var(--muted); }
details.hist { border: 1px solid var(--edge-dim); background: var(--panel); }
details.hist summary { list-style: none; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; cursor: pointer; }
details.hist summary::-webkit-details-marker { display: none; }
.hn { font-weight: 600; min-width: 0; }
.hs { font-size: 13px; color: var(--muted); }
.hs .pos { color: var(--glow); font-weight: 600; }
.spark { grid-row: 1 / span 2; grid-column: 2; }
.spark path.l { fill: none; stroke: var(--glow); stroke-width: 2; }
.spark path.a { fill: rgb(var(--glow-rgb) / .14); }
.spark circle { fill: var(--glow); }
.hist .scroll { overflow-x: auto; }
.hist table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.hist td, .hist th { padding: 7px 14px; border-top: 1px solid var(--edge-dim); vertical-align: top; text-align: left; white-space: nowrap; }
.hist th { font-family: var(--font-display); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--muted); font-weight: 600; }
.hist td:first-child { color: var(--muted); width: 1%; }

.card { display: flex; flex-direction: column; gap: 10px; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 19px; letter-spacing: .08em; text-transform: uppercase; }
.card p { margin: 0; font-size: 14px; color: var(--muted); }
.card textarea { width: 100%; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 9px 12px; min-height: 120px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
.file { position: relative; overflow: hidden; display: inline-flex; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* login */
.login { max-width: 460px; margin: 6vh auto 0; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1; }
.login .brand { font-size: 34px; text-align: center; }
.login .who { display: flex; flex-direction: column; gap: 8px; }
.login .who button { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--edge); background: var(--sunk); padding: 12px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .06em; }
.login .who button small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12.5px; color: var(--muted); letter-spacing: 0; }
.login .new { display: flex; gap: 8px; }
.login .new input { flex: 1; min-width: 0; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 11px 12px; font-size: 17px; }

.timer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(4, 8, 18, .96); border-top: 1px solid var(--glow); box-shadow: 0 -6px 24px rgb(var(--glow-rgb) / .25);
}
.timer-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.timer-t { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; min-width: 70px; color: var(--glow); }
.timer-l { flex: 1; font-size: 13px; color: var(--muted); min-width: 0; }
.timer.over { border-top-color: var(--gold); }
.timer.over .timer-t { color: var(--gold); }
.toast, .update {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30;
  width: min(calc(100vw - 32px), 420px); text-align: center;
}
.toast .badge { margin: 4px auto 0; display: grid; }
.toast .title { font-size: 24px; color: var(--gold); text-shadow: 0 0 14px rgb(255 200 97 / .6); }
.toast p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.update { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .1em; text-transform: uppercase; color: var(--glow); cursor: pointer; z-index: 29; }
.update small { display: block; font-family: var(--font-body); font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--muted); }

#cracks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; display: none; }
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 4; display: none; box-shadow: inset 0 0 90px 24px rgb(255 20 40 / .32); }
:root.pz #cracks, :root.pz .vignette { display: block; }
:root.pz .brand::before, :root.pz .brand::after { content: attr(data-text); position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; }
:root.pz .brand::before { color: #ff2a3d; clip-path: inset(0 0 100% 0); }
:root.pz .brand::after { color: #6fe0ff; opacity: .7; clip-path: inset(0 0 100% 0); }
@media (prefers-reduced-motion: no-preference) {
  .ex, .set .tick { transition: border-color .2s, background .2s, box-shadow .2s; }
  .pop { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateX(-50%) scale(.94); opacity: .4; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  :root.pz .vignette { animation: throb 3.2s ease-in-out infinite; }
  @keyframes throb { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
  :root.pz .brand::before { animation: g1 2.6s infinite steps(1); }
  :root.pz .brand::after { animation: g2 3.3s infinite steps(1); }
  @keyframes g1 { 0%, 86%, 100% { transform: none; clip-path: inset(0 0 100% 0); } 87% { transform: translate(3px, -1px); clip-path: inset(10% 0 55% 0); } 90% { transform: translate(-4px, 1px); clip-path: inset(60% 0 8% 0); } 93% { transform: translate(2px, 0); clip-path: inset(30% 0 40% 0); } }
  @keyframes g2 { 0%, 80%, 100% { transform: none; clip-path: inset(0 0 100% 0); } 81% { transform: translate(-3px, 1px); clip-path: inset(50% 0 20% 0); } 84% { transform: translate(3px, 0); clip-path: inset(5% 0 70% 0); } }
  :root.pz .quest .title { animation: shake 6s infinite; }
  @keyframes shake { 0%, 94%, 100% { transform: none; } 95% { transform: translate(-2px, 1px) skewX(-4deg); } 96% { transform: translate(3px, -1px) skewX(3deg); } 97% { transform: translate(-1px, 0); } }
}

/* rotating warning glitch */
#warnTxt { display: inline; }
#warnTxt.gl { display: inline-block; animation: wg .46s steps(7); }
@keyframes wg { 0% { transform: none; } 15% { transform: translate(-3px, 0) skewX(-10deg); text-shadow: 2px 0 #ff2a3d, -2px 0 #6fe0ff; clip-path: inset(0 0 55% 0); }
  30% { transform: translate(4px, 0); clip-path: inset(40% 0 10% 0); opacity: .5; } 45% { transform: translate(-2px, 1px); clip-path: inset(10% 0 60% 0); text-shadow: -2px 0 #ff2a3d, 2px 0 #6fe0ff; }
  60% { transform: translate(2px, 0); clip-path: inset(60% 0 0 0); opacity: .7; } 80% { transform: translate(-1px, 0); clip-path: none; } 100% { transform: none; opacity: 1; } }
/* program editor */
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-family: var(--font-display); letter-spacing: .08em; text-transform: uppercase; min-width: 0; }
.pgrid label.wide { grid-column: 1 / -1; }
.pgrid input, .pgrid select { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 9px 11px; font-family: var(--font-body); font-size: 16px; letter-spacing: 0; text-transform: none; color: var(--fg); min-width: 0; width: 100%; }
.floor { margin: 0; font-size: 13.5px; padding: 6px 10px; border: 1px solid var(--edge-dim); }
.floor.ok { border-color: var(--glow); color: var(--glow); }
.floor.bad { border-color: var(--gold); color: var(--gold); }
.prows { display: flex; flex-direction: column; gap: 8px; }
.prow { border: 1px solid var(--edge-dim); background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.pn b { display: block; font-family: var(--font-display); font-size: 18px; letter-spacing: .03em; }
.pn small { color: var(--muted); font-size: 12px; }
.pc { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.step { display: inline-flex; align-items: center; gap: 8px; }
.step b { font-family: var(--font-display); font-size: 20px; min-width: 18px; text-align: center; }
.step .btn, .mv .btn { padding: 4px 11px; }
.rng { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.rng input { width: 52px; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 6px 6px; text-align: center; font-size: 16px; }
.mv { display: inline-flex; gap: 4px; }
.psum { display: flex; flex-direction: column; }
.psum div { display: grid; grid-template-columns: 44px 1fr; gap: 0 10px; padding: 6px 0; border-top: 1px solid var(--edge-dim); }
.psum div:first-child { border-top: 0; }
.psum b { font-family: var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--glow); grid-row: span 2; }
.psum span { font-weight: 600; min-width: 0; }
.psum small { color: var(--muted); font-size: 12px; min-width: 0; }
.mrow { display: inline-flex; gap: 3px; }

/* ---------- v6: quest points, confirm diamonds, cardio machines, week strip ---------- */
.qpts { display: flex; flex-direction: column; gap: 5px; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 9px 11px; }
.qpts .qrow { display: flex; justify-content: space-between; align-items: baseline; }
.qpts .qrow span { font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.qpts b { font-family: var(--font-display); font-size: 26px; line-height: 1; }
.qpts b small { font-size: 15px; color: var(--muted); }
.qpts > small { color: var(--muted); font-size: 12.5px; }
.qpts.ok { border-color: var(--gold); }
.qpts.ok b { color: var(--gold); }
.plan-h { margin: 2px 0 -4px; font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
.wstrip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--edge-dim); padding-top: 9px; }
.wstrip small { flex-basis: 100%; color: var(--muted); font-size: 11.5px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; min-width: 0; }
.wd b { font-family: var(--font-display); font-size: 12px; color: var(--muted); }
.wd i { width: 14px; height: 14px; border: 1.5px solid var(--edge-dim); transform: rotate(45deg) scale(.8); }
.wd.ok i { background: var(--glow); border-color: var(--glow); box-shadow: 0 0 6px var(--glow); }
.wd.miss i { border-color: var(--red); transform: none; border: 0; }
.wd.miss i::before { content: "✕"; display: block; color: var(--red); font-size: 13px; line-height: 14px; text-align: center; font-style: normal; font-weight: 700; }
.wd { border: 0; background: none; padding: 2px 0; }
.wd.rest i, .wd.pre i { border-radius: 50%; transform: none; border-color: var(--muted); opacity: .6; }
.wd.ex i { transform: none; border: 0; width: auto; height: 14px; }
.wd.ex i::before { content: "E"; font-style: normal; font-family: var(--font-display); font-weight: 700; font-size: 13px; line-height: 14px; color: var(--gold); }
.wd.now i { border-color: var(--gold); }
.days button.rest { opacity: .62; border-style: dashed; }
.days.sched button[aria-pressed="false"] { opacity: .55; border-style: dashed; }
.days.sched button[aria-pressed="true"] small { color: var(--glow); }
.psum .restday { opacity: .6; }
.kinds { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -2px 0; }
.kinds::-webkit-scrollbar { display: none; }
.kinds button { flex: none; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 5px 10px; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .04em; color: var(--muted); }
.kinds button[aria-pressed="true"] { border-color: var(--glow); color: var(--fg); background: rgb(var(--glow-rgb) / .14); }
.set { grid-template-columns: 24px 1fr 12px 1fr 36px; }
.set.one { grid-template-columns: 24px 1fr 36px; }
.tick { width: 36px; height: 36px; border: 0; background: none; padding: 0; display: grid; place-items: center; transform: none; }
.tick::before { content: ""; width: 19px; height: 19px; border: 1.5px solid var(--edge-dim); transform: rotate(45deg); transition: background .2s, border-color .2s, box-shadow .2s; }
.set.pend .tick::before { border-color: var(--gold); box-shadow: 0 0 8px rgb(255 200 97 / .45); animation: throb 1.4s ease-in-out infinite; }
.set.pend .field input { border-color: rgb(255 200 97 / .45); }
.set.done .tick { background: none; box-shadow: none; }
.set.done .tick::before { background: var(--glow); border-color: var(--glow); box-shadow: 0 0 8px var(--glow); }
.set.done .field input { color: var(--glow); }
.sus { display: flex; flex-direction: column; gap: 8px; }
.sus > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 8px 10px; }
.sus span { display: flex; flex-direction: column; min-width: 0; }
.sus small { color: var(--muted); font-size: 12.5px; }
.cbon { color: var(--gold); font-size: 13px; margin-left: 4px; }
.tabs .dot { position: absolute; top: 6px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); font-size: 0; box-shadow: 0 0 8px rgb(255 200 97 / .9); }

/* ---------- v6: Vault ---------- */
.boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.boxbtn { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.boxbtn .pack { width: 100%; }
.boxbtn b { position: absolute; top: -6px; right: -4px; z-index: 5; min-width: 24px; height: 24px; border-radius: 12px; background: var(--gold); color: #1b1204; font-family: var(--font-display); font-size: 15px; line-height: 24px; padding: 0 6px; box-shadow: 0 0 10px rgb(255 200 97 / .7); }
.boxbtn span { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; letter-spacing: .04em; text-align: center; color: var(--muted); line-height: 1.15; }
.boxbtn:disabled { opacity: .35; cursor: default; }
.boxbtn:disabled b { background: var(--sunk); color: var(--muted); box-shadow: none; }
.vchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 2px; }
.vchips::-webkit-scrollbar { display: none; }
.vchip { flex: none; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 6px 11px; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .04em; color: var(--muted); }
.vchip small { margin-left: 5px; opacity: .8; }
.vchip[aria-pressed="true"] { border-color: var(--glow); color: var(--fg); background: rgb(var(--glow-rgb) / .14); }
.vgrid, .showcase { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }
@media (min-width: 520px) { .vgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.vcell { position: relative; border: 0; background: none; padding: 0; text-align: left; min-width: 0; content-visibility: auto; contain-intrinsic-size: auto 150px; }
.vcell .tc, .vcell .tc::before, .vcell .tc::after, .vcell .tc *::before, .vcell .tc *::after { animation: none !important; }
.lockcard { position: relative; aspect-ratio: 5 / 7; opacity: .5; }
.lockcard .rune { animation: none; }
.lockno { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .08em; color: #cfe0ff; z-index: 2; }
.lockno small { display: block; font-size: 11px; color: var(--muted); }
.vb { position: absolute; top: -6px; right: -6px; z-index: 10; font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: .08em; padding: 2px 6px; border-radius: 6px; background: #8dffb0; color: #032010; box-shadow: 0 0 10px #8dffb0aa; }
.vb.cnt { background: #1b3157; color: #cfe0ff; box-shadow: none; }
body.noscroll { overflow: hidden; }
.pov { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 10px; touch-action: none;
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: radial-gradient(120% 60% at 50% 0%, #0b1838, #04060c 62%); }
.pov[hidden] { display: none; }
.vsum h2 { font-family: var(--font-display); letter-spacing: .14em; text-transform: uppercase; margin: 4px 0 0; font-size: 22px; }
.cdet { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgb(2 4 9 / .94); touch-action: none;
  padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); }
.cdet[hidden] { display: none; }
.cdhold { width: min(80vw, calc((100dvh - 250px) * 5 / 7), 440px); margin-top: 30px; }
.cdhold .tc { animation: vpop .35s cubic-bezier(.2, .9, .3, 1.2); }
.cdinfo { text-align: center; font-size: 13px; color: var(--muted); line-height: 1.5; }
.cdinfo b { font-family: var(--font-display); font-size: 17px; letter-spacing: .12em; text-transform: uppercase; display: block; }
.cdnav { display: flex; gap: 10px; align-items: center; }
.cdnav .btn { min-width: 44px; min-height: 40px; }
.cdx { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px; min-width: 44px; min-height: 40px; }
/* ---------- pack ---------- */
.pack { --ph: 1; position: relative; aspect-ratio: 5 / 8.2; container-type: inline-size; filter: drop-shadow(0 14px 26px rgb(0 0 0 / .6)); }
.pack .flap, .pack .pbody { position: absolute; left: 0; right: 0; overflow: hidden; }
.pack .flap { top: 0; height: 15%; z-index: 2; transform-origin: 0% 100%; }
.pack .pbody { top: 15%; bottom: 0; }
.pack .skin { position: absolute; left: 0; right: 0; height: calc(100% / .85); }
.pack .flap .skin { top: 0; height: calc(100% / .15); }
.pack .pbody .skin { bottom: 0; }
.skin { background: linear-gradient(115deg, var(--p1), var(--p2) 45%, var(--p1) 70%, var(--p3)); border-radius: 3cqw; overflow: hidden;
  -webkit-mask: linear-gradient(#000, #000) center / 100% 92% no-repeat, conic-gradient(from -45deg at 50% 0, #000 90deg, transparent 0) top / 5.4cqw 2.6cqw repeat-x, conic-gradient(from 135deg at 50% 100%, #000 90deg, transparent 0) bottom / 5.4cqw 2.6cqw repeat-x;
          mask: linear-gradient(#000, #000) center / 100% 92% no-repeat, conic-gradient(from -45deg at 50% 0, #000 90deg, transparent 0) top / 5.4cqw 2.6cqw repeat-x, conic-gradient(from 135deg at 50% 100%, #000 90deg, transparent 0) bottom / 5.4cqw 2.6cqw repeat-x; }
.skin::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 18px, rgb(255 255 255 / .06) 19px 21px), linear-gradient(105deg, transparent 35%, rgb(255 255 255 / .35) 48%, transparent 60%); background-size: auto, 250% 100%; animation: packshine 4.5s ease-in-out infinite; z-index: 2; pointer-events: none; }
@keyframes packshine { 0%, 50% { background-position: 0 0, 130% 0; } 100% { background-position: 0 0, -130% 0; } }
.skin .pwin { position: absolute; left: 9%; right: 9%; top: 20%; height: 56%; border-radius: 2.5cqw; overflow: hidden; border: .8cqw solid rgb(255 255 255 / .35); box-shadow: 0 0 6cqw rgb(0 0 0 / .5), inset 0 0 8cqw rgb(0 0 0 / .4); }
.skin .pwin img { width: 100%; height: 100%; object-fit: cover; display: block; }
.skin .pbrand { position: absolute; top: 7.5%; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-weight: 700; letter-spacing: .3em; font-size: 4.2cqw; color: rgb(255 255 255 / .8); text-transform: uppercase; }
.skin .pname { position: absolute; top: 78.5%; left: 6%; right: 6%; text-align: center; font-family: var(--font-display); font-weight: 700; letter-spacing: .08em; font-size: 6.6cqw; line-height: 1.05; color: #fff; text-transform: uppercase; text-shadow: 0 0 3cqw var(--p2), 0 .5cqw 0 rgb(0 0 0 / .5); }
.skin .pcount { position: absolute; bottom: 6%; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-weight: 600; letter-spacing: .25em; font-size: 3.8cqw; color: rgb(255 255 255 / .7); }
.tearline { position: absolute; left: 3%; right: 3%; top: 15%; height: 0; border-top: .6cqw dashed rgb(255 255 255 / .45); z-index: 3; pointer-events: none; }
.tearglow { position: absolute; left: 0; top: calc(15% - 1.2cqw); height: 2.4cqw; width: 0; z-index: 4; border-radius: 2cqw; background: linear-gradient(90deg, transparent, #fff 30%, #bff0ff); box-shadow: 0 0 4cqw 1cqw #9fe7ff; pointer-events: none; }
.pack.torn .flap { animation: flapoff .7s cubic-bezier(.3, .6, .4, 1) forwards; }
@keyframes flapoff { to { transform: translate(60cqw, -50cqw) rotate(38deg); opacity: 0; } }
.pack.drop { animation: packdrop .7s .25s cubic-bezier(.5, 0, .8, .4) forwards; }
@keyframes packdrop { to { transform: translateY(120%); opacity: 0; } }
.pack.idle { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-.6deg); } }

/* ---------- open screen ---------- */
.vtop { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 30; }
.vtop .vttl { font-family: var(--font-display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 15px; color: #b9cbe8; text-align: center; flex: 1; }
.vstage { position: relative; flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; }
.vstage-in { position: relative; width: min(78vw, calc((100dvh - 190px) * 5 / 7.2), 380px); aspect-ratio: 5 / 7; }
.vstage-in > .pack { position: absolute; left: 5%; right: 5%; top: 50%; translate: 0 -50%; z-index: 10; touch-action: none; cursor: grab; }
.vhint { font-family: var(--font-display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 14px; color: #9fd8ff; margin: 0; min-height: 20px; text-align: center; animation: vpulse 1.8s ease-in-out infinite; }
@keyframes vpulse { 50% { opacity: .45; } }
.finger { position: absolute; top: 9%; left: 8%; z-index: 12; width: 34px; height: 34px; border-radius: 50%; background: rgb(255 255 255 / .85); box-shadow: 0 0 18px #9fe7ff; pointer-events: none; animation: swipehint 2s ease-in-out infinite; }
@keyframes swipehint { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: .9; } 70% { transform: translateX(min(60vw, 280px)); opacity: .9; } 100% { transform: translateX(min(60vw, 280px)); opacity: 0; } }
.stack { position: absolute; inset: 0; z-index: 5; }
.stack.rise { animation: rise .7s .35s cubic-bezier(.2, .9, .3, 1.1) both; }
@keyframes rise { from { transform: translateY(35%) scale(.92); opacity: 0; } }
.slot { position: absolute; inset: 0; perspective: 1200px; transition: transform .35s cubic-bezier(.2, .8, .3, 1); touch-action: none; }
.slot.fly { transition: transform .45s cubic-bezier(.3, .4, .6, 1), opacity .45s; }
.flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3, 1.3, .5, 1); transform: rotateY(180deg); }
.flip.up { transform: rotateY(0deg); }
.flip > .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip > .back { transform: rotateY(180deg); }
.vcount { font-family: var(--font-display); font-weight: 600; letter-spacing: .16em; color: var(--muted); font-size: 13px; min-height: 18px; }
.burst { position: absolute; left: 50%; top: 50%; width: 260%; aspect-ratio: 1; translate: -50% -50%; z-index: 4; pointer-events: none; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, var(--bc) 0 6deg, transparent 6deg 18deg); -webkit-mask: radial-gradient(closest-side, #000 15%, transparent 72%); mask: radial-gradient(closest-side, #000 15%, transparent 72%);
  animation: burst 1.6s ease-out forwards; }
@keyframes burst { from { transform: scale(.2) rotate(0); opacity: 1; } to { transform: scale(1.1) rotate(50deg); opacity: 0; } }
.flash { position: fixed; inset: 0; z-index: 50; pointer-events: none; background: var(--bc); animation: flash .7s ease-out forwards; mix-blend-mode: screen; }
@keyframes flash { from { opacity: .75; } to { opacity: 0; } }
.vshake { animation: vshake .5s linear; }
@keyframes vshake { 10%, 50%, 90% { translate: -5px 2px; } 30%, 70% { translate: 5px -2px; } }
.glitchfx { animation: gfx .9s steps(1) 2; }
@keyframes gfx { 0% { filter: none; translate: 0; } 10% { filter: hue-rotate(90deg) saturate(3); translate: -8px 0; } 20% { filter: invert(1); translate: 6px 3px; } 30% { filter: none; translate: 0; } 50% { filter: hue-rotate(-120deg) contrast(2); translate: 4px -4px; } 60% { filter: none; translate: 0; } }
.rlabel { position: absolute; left: 50%; bottom: -36px; translate: -50% 0; white-space: nowrap; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; z-index: 20; pointer-events: none; animation: rl 1.6s ease-out forwards; color: var(--bc); text-shadow: 0 0 14px var(--bc); }
@keyframes rl { 0% { opacity: 0; transform: translateY(10px) scale(.8); } 20%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* summary */
.vsum { display: none; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 520px; overflow-y: auto; flex: 1; min-height: 0; padding: 10px 8px 8px; }
.vsum.on { display: flex; }
.vsum h2 { font-family: var(--font-display); letter-spacing: .14em; text-transform: uppercase; margin: 4px 0 0; font-size: 22px; }
.vsum .vgain { color: var(--muted); font-size: 13.5px; margin: -8px 0 0; text-align: center; }
.vsum .vgain b { color: #8dffb0; }
.vsum-grid { padding: 8px 6px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.vsum-grid .vcell { position: relative; cursor: pointer; animation: vpop .4s both; }
@keyframes vpop { from { transform: scale(.7); opacity: 0; } }
.vb { position: absolute; top: -6px; right: -6px; z-index: 10; font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: .08em; padding: 2px 6px; border-radius: 6px; background: #8dffb0; color: #032010; box-shadow: 0 0 10px #8dffb0aa; }
.vb.cnt { background: #1b3157; color: #cfe0ff; box-shadow: none; }
.vsum-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* =================== CARDS =================== */
.tc { --mx: 50%; --my: 50%; --rx: 0deg; --ry: 0deg; --c: #8a9bb3; container-type: inline-size;
  position: relative; aspect-ratio: 5 / 7; width: 100%; border-radius: 4.6cqw; overflow: hidden; isolation: isolate;
  transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .2s ease-out;
  background: #0d1424; border: .9cqw solid var(--c); display: flex; flex-direction: column; padding: 3.2cqw; gap: 2.2cqw; user-select: none; -webkit-user-select: none; }
.tc .ttop { display: flex; justify-content: space-between; align-items: baseline; gap: 2cqw; position: relative; z-index: 5; }
.tc .tn { font-family: var(--font-display); font-weight: 700; font-size: 6.6cqw; line-height: 1.02; letter-spacing: .02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc .tbst { font-family: var(--font-display); font-weight: 700; font-size: 5cqw; color: var(--c); white-space: nowrap; }
.tc .tart { position: relative; flex: 1; border-radius: 2.4cqw; border: .4cqw solid rgb(255 255 255 / .14); background: #111c33; overflow: hidden; z-index: 1; min-height: 0; }
.tc .tart img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; display: block; pointer-events: none; -webkit-user-drag: none; }
.tc .tmeta { position: relative; z-index: 5; display: flex; flex-direction: column; gap: 1.3cqw; }
.tc .ttype { font-size: 4cqw; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; font-family: var(--font-display); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc .tfl { font-size: 4.4cqw; line-height: 1.3; color: #b8c7e0; font-style: italic; min-height: 2.6em; }
.tc .tfoot { display: flex; justify-content: space-between; font-size: 4cqw; color: var(--muted); font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; }
.tc .tfoot .tsym { color: var(--c); }
.tc .tperk { font-size: 4cqw; color: #2affea; font-family: var(--font-display); font-weight: 700; letter-spacing: .06em; }
.tc.tmini { padding: 3.6cqw; gap: 2.6cqw; }
.tc.tmini .tn { font-size: 9cqw; }
.tc .tn.long { font-size: 5.4cqw; white-space: normal; }
.tc.tmini .tn.long { font-size: 7.4cqw; }
.tc.tmini .tbst { font-size: 7.5cqw; }
.tc.tmini .tmeta .ttype, .tc.tmini .tmeta .tfl, .tc.tmini .tmeta .tperk { display: none; }
.tc.tmini .tfoot { font-size: 7cqw; }

.tc.common { --c: #8a9bb3; }
.tc.uncommon { --c: #c9d6e8; background: linear-gradient(160deg, #142036, #0d1424); }
.tc.uncommon::after, .tc.rare::after { content: ""; position: absolute; inset: -40%; z-index: 6; pointer-events: none;
  background: linear-gradient(105deg, transparent 42%, rgb(255 255 255 / .2) 50%, transparent 58%); animation: sweep 6s ease-in-out infinite; }
@keyframes sweep { 0%, 60% { transform: translateX(-60%); } 85%, 100% { transform: translateX(60%); } }
.tc.rare { --c: #ffcf6b; border-color: transparent; background: linear-gradient(#0e1628, #0e1628) padding-box, linear-gradient(135deg, #8a5a12, #ffe39a, #b07a1c, #ffd56e) border-box; }
.tc.rare::after { animation-duration: 4s; background: linear-gradient(105deg, transparent 40%, rgb(255 230 160 / .32) 50%, transparent 60%); }
.tc.rare .tn, .tc.secret .tn { background: linear-gradient(90deg, #c98f22, #ffe9a8, #d99a2a, #fff3c9); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tc.holo { --c: #9fe7ff; border-color: transparent; background: linear-gradient(#0d1527, #0d1527) padding-box, linear-gradient(135deg, #6ad7ff, #b98aff, #ff8ad8, #ffe28a, #6affc8) border-box; }
.tc.holo .tart::before { content: ""; position: absolute; inset: 0; z-index: 3; mix-blend-mode: color-dodge; opacity: .42; pointer-events: none;
  background: repeating-linear-gradient(115deg, #ff6a88 0%, #ffd36a 6%, #6affb0 12%, #6ac8ff 18%, #c56aff 24%, #ff6a88 30%);
  background-size: 300% 300%; background-position: var(--mx) var(--my); animation: drift 7s ease-in-out infinite alternate; }
.tc.holo .tart::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: .7;
  background-image: radial-gradient(circle, #fff 0 1px, transparent 1.5px); background-size: 6cqw 6cqw; animation: twinkle 2.4s steps(2) infinite; mix-blend-mode: overlay; }
@keyframes drift { from { background-position: 0% 30%; } to { background-position: 100% 70%; } }
@keyframes twinkle { 50% { opacity: .2; } }
.tc.fullart, .tc.secret { padding: 0; }
.tc.fullart { --c: #ffffff; border-color: transparent; background: linear-gradient(#0a0f1e, #0a0f1e) padding-box, linear-gradient(135deg, #ff9ad5, #9ad8ff, #c79aff, #ffe59a) border-box; }
.tc.fullart .tart, .tc.secret .tart { position: absolute; inset: 0; border: 0; border-radius: 0; z-index: 0; }
.tc.fullart::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; mix-blend-mode: soft-light; opacity: .75;
  background: repeating-linear-gradient(45deg, rgb(255 255 255 / 0) 0 2cqw, rgb(255 255 255 / .3) 2.3cqw 2.7cqw), repeating-linear-gradient(115deg, #ff6a88, #ffd36a 10%, #6affb0 20%, #6ac8ff 30%, #c56aff 40%, #ff6a88 50%);
  background-size: auto, 400% 400%; background-position: 0 0, var(--mx) var(--my); animation: drift2 6s ease-in-out infinite alternate; }
@keyframes drift2 { from { background-position: 0 0, 0% 0%; } to { background-position: 0 0, 100% 100%; } }
.tc.fullart .ttop, .tc.fullart .tmeta, .tc.secret .ttop, .tc.secret .tmeta { margin: 3cqw; padding: 2cqw 2.8cqw; border-radius: 2.4cqw; background: rgb(6 10 22 / .6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.tc.fullart .ttop, .tc.secret .ttop { margin-bottom: 0; }
.tc.fullart .tmeta, .tc.secret .tmeta { margin-top: auto; }
.tc.secret { --c: #ffd66e; border: 1.2cqw solid transparent; background: linear-gradient(#1e1404, #1e1404) padding-box, linear-gradient(135deg, #fff3c4, #c98f22, #fff8dc, #b07a1c, #ffe39a) border-box; }
.tc.secret .tart img { filter: sepia(.25) saturate(1.15); }
.tc.secret .tart::after { content: ""; position: absolute; inset: 0; z-index: 2; background: linear-gradient(160deg, rgb(255 210 110 / .22), transparent 40%, rgb(255 190 80 / .25)); mix-blend-mode: overlay; }
.tc.secret::before { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  background-image: radial-gradient(circle, #fff7d6 0 1px, transparent 1.6px), radial-gradient(circle, #ffe08a 0 .8px, transparent 1.4px);
  background-size: 7cqw 7cqw, 4cqw 4cqw; background-position: 0 0, 2cqw 3cqw; animation: glitter 1.8s steps(3) infinite; opacity: .85; }
.tc.secret::after { content: ""; position: absolute; inset: -30%; z-index: 4; pointer-events: none; background: linear-gradient(110deg, transparent 40%, rgb(255 248 220 / .42) 50%, transparent 60%); animation: sweep 3.5s ease-in-out infinite; }
@keyframes glitter { 33% { opacity: .35; background-position: 1cqw .5cqw, 1cqw 3.5cqw; } 66% { opacity: .75; background-position: 3cqw 2cqw, 3.5cqw .5cqw; } }
.tc.secret .tfl, .tc.secret .ttype, .tc.secret .tfoot { color: #f6e3b4; }
.tc.secret .ttop, .tc.secret .tmeta { background: rgb(26 16 2 / .72); }
.tc.glitch { --c: #ff2a6d; border-color: transparent; background: linear-gradient(#05070d, #05070d) padding-box, conic-gradient(from var(--a, 0deg), #ff2a6d, #2affea, #b62aff, #ff2a6d) border-box; animation: spin 3s linear infinite, jolt 3.7s steps(1) infinite; }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --a: 360deg; } }
@keyframes jolt { 0%, 91%, 100% { translate: 0 0; filter: none; } 92% { translate: -1.2cqw .4cqw; filter: hue-rotate(90deg); } 94% { translate: 1.5cqw -.4cqw; } 96% { translate: -.4cqw 0; filter: hue-rotate(-60deg) saturate(2); } }
.tc.glitch .tart img.r, .tc.glitch .tart img.b { mix-blend-mode: screen; opacity: .55; z-index: 1; }
.tc.glitch .tart img.r { filter: sepia(1) saturate(8) hue-rotate(-50deg); animation: rgb1 2.2s steps(1) infinite; }
.tc.glitch .tart img.b { filter: sepia(1) saturate(8) hue-rotate(140deg); animation: rgb2 1.9s steps(1) infinite; }
.tc.glitch .tart img.m { filter: saturate(.6) contrast(1.15); }
@keyframes rgb1 { 0%, 100% { transform: translate(-1cqw, 0); } 30% { transform: translate(-2.5cqw, .5cqw); clip-path: inset(20% 0 50% 0); } 31% { clip-path: none; } 70% { transform: translate(-.5cqw, -1cqw); } }
@keyframes rgb2 { 0%, 100% { transform: translate(1cqw, 0); } 45% { transform: translate(3cqw, -.5cqw); clip-path: inset(55% 0 10% 0); } 46% { clip-path: none; } 80% { transform: translate(.5cqw, 1cqw); } }
.tc.glitch .tart::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg, rgb(0 0 0 / .35) 0 1px, transparent 1px 3px); }
.tc.glitch .tart::before { content: ""; position: absolute; left: 0; right: 0; height: 14%; z-index: 3; background: rgb(255 42 109 / .2); animation: bar 2.8s linear infinite; mix-blend-mode: screen; }
@keyframes bar { from { top: -15%; } to { top: 110%; } }
.tc.glitch .tn { color: #ff9dbd; text-shadow: .3cqw 0 #2affea, -.3cqw 0 #ff2a6d; }
.tc.glitch .tbst, .tc.glitch .tfoot .tsym { color: #2affea; }
.tc.glitch .tfl { color: #9fb8d6; font-family: ui-monospace, Menlo, monospace; font-style: normal; font-size: 4cqw; }
/* calm the grid: no looping foil on thumbnails */
.vgrid .tc, .vgrid .tc::before, .vgrid .tc::after, .vgrid .tc *::before, .vgrid .tc *::after, .vsum-grid .tc::after { animation: none !important; }
.vgrid .tc.glitch .tart img.r, .vgrid .tc.glitch .tart img.b { animation: none; }

/* card back */
.cback { position: absolute; inset: 0; border-radius: 4.6cqw; container-type: inline-size; overflow: hidden; --gc: #8a9bb3; --peek: 0;
  background: radial-gradient(circle at 50% 50%, #12305a, #070d1c 70%); border: .9cqw solid var(--gc);
  box-shadow: 0 0 calc(4px + var(--peek) * 40px) calc(var(--peek) * 8px) var(--gc), inset 0 0 calc(var(--peek) * 30px) var(--gc); transition: box-shadow .15s; }
.cback::before { content: ""; position: absolute; inset: 6cqw; border-radius: 3cqw; border: .5cqw solid rgb(76 195 255 / .35);
  background: repeating-conic-gradient(from 0deg at 50% 50%, rgb(76 195 255 / .08) 0 10deg, transparent 10deg 20deg); }
.cback::after { content: "SOLO\A LIFTING"; white-space: pre; position: absolute; left: 0; right: 0; top: 50%; translate: 0 -50%; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 11cqw; line-height: .95; letter-spacing: .18em; color: #bfe6ff; text-shadow: 0 0 5cqw #4cc3ff; }
.cback .rune { position: absolute; left: 50%; top: 50%; width: 62cqw; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; border: .6cqw solid rgb(76 195 255 / .5); box-shadow: 0 0 6cqw rgb(76 195 255 / .35), inset 0 0 6cqw rgb(76 195 255 / .25); animation: spinr 14s linear infinite; }
.cback .rune::before { content: ""; position: absolute; inset: 7cqw; border-radius: 50%; border: .4cqw dashed rgb(76 195 255 / .5); }
@keyframes spinr { to { rotate: 360deg; } }
.cback.g-U { --gc: #e4eeff; }
.cback.g-R { --gc: #ffcf6b; }
.cback.g-H { --gc: #9fe7ff; border-color: transparent; background: radial-gradient(circle, #12305a, #070d1c 70%) padding-box, linear-gradient(135deg, #6ad7ff, #b98aff, #ff8ad8, #ffe28a, #6affc8) border-box; }
.cback.g-F { --gc: #ff9ad5; border-color: transparent; background: radial-gradient(circle, #12305a, #070d1c 70%) padding-box, linear-gradient(135deg, #ff9ad5, #9ad8ff, #c79aff, #ffe59a) border-box; }
.cback.g-S { --gc: #ffd66e; border-color: #ffd66e; }
.cback.g-G { --gc: #ff2a6d; border-color: #ff2a6d; animation: gback .5s steps(1) infinite; }
@keyframes gback { 50% { --gc: #2affea; border-color: #2affea; } }


/* ---------- loot box cube ---------- */
.cubewrap { --s: 120px; position: relative; width: calc(var(--s) * 1.5); height: calc(var(--s) * 1.55); display: grid; place-items: center; perspective: calc(var(--s) * 7); margin: 0 auto; }
.cube { position: relative; width: var(--s); height: var(--s); transform-style: preserve-3d; transform: rotateX(-32deg) rotateY(-38deg); }
.cubewrap.idle .cube { animation: cubesway 5s ease-in-out infinite; }
.cubewrap.idle { animation: cubefloat 3s ease-in-out infinite; }
@keyframes cubesway { 50% { transform: rotateX(-32deg) rotateY(-26deg); } }
@keyframes cubefloat { 50% { translate: 0 calc(var(--s) * -.06); } }
.cf { position: absolute; inset: 0; display: block; backface-visibility: hidden;
  background: radial-gradient(circle at 30% 25%, rgb(255 255 255 / .16), transparent 55%), linear-gradient(150deg, var(--c1), var(--c2));
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .18), inset 0 0 calc(var(--s) * .25) rgb(0 0 0 / .55); }
/* the ribbon: a glowing band down the middle of every side, crossing on the lid, no bow */
.cf::before, .ft::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 13%; translate: -50% 0;
  background: linear-gradient(90deg, transparent, var(--rb) 30%, #fff 50%, var(--rb) 70%, transparent);
  box-shadow: 0 0 calc(var(--s) * .12) var(--rb); opacity: .92; animation: ribbon 2.4s ease-in-out infinite; }
.ft::after { left: 0; right: 0; top: 50%; bottom: auto; width: auto; height: 13%; translate: 0 -50%; background: linear-gradient(180deg, transparent, var(--rb) 30%, #fff 50%, var(--rb) 70%, transparent); }
@keyframes ribbon { 50% { opacity: .65; filter: brightness(.85); } }
.ft { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); filter: brightness(1.25); }
.fb { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
.ff { transform: translateZ(calc(var(--s) / 2)); }
.fk { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.fr { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); filter: brightness(.8); }
.fl { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); filter: brightness(.8); }
.cshadow { position: absolute; bottom: 2%; left: 22%; right: 22%; height: 8%; border-radius: 50%; background: radial-gradient(closest-side, rgb(0 0 0 / .6), transparent); filter: blur(2px); }
.cubewrap::after { content: ""; position: absolute; left: 50%; top: 50%; width: 120%; aspect-ratio: 1; translate: -50% -55%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--rb) 35%, transparent), transparent 70%); pointer-events: none; z-index: -1; }
.cube-B .cf { box-shadow: inset 0 0 0 1px rgb(255 240 184 / .45), inset 0 0 calc(var(--s) * .25) rgb(0 0 0 / .45); }
.cube-C .cf { background: radial-gradient(circle at 70% 80%, rgb(255 74 106 / .18), transparent 50%), repeating-linear-gradient(125deg, transparent 0 18%, rgb(0 0 0 / .35) 18.5% 19.5%, transparent 20% 46%), linear-gradient(150deg, var(--c1), var(--c2)); }
.cube-C .cf::before, .cube-C .ft::after { animation: ribbonc 1.3s steps(2) infinite; }
@keyframes ribbonc { 50% { opacity: .55; } }
.cubewrap.opening .cube { animation: rattle .12s linear infinite; }
.cubewrap.opening .cf::before, .cubewrap.opening .ft::after { animation: none; opacity: 1; filter: brightness(1.6); box-shadow: 0 0 calc(var(--s) * .3) var(--rb); }
@keyframes rattle { 0%, 100% { transform: rotateX(-32deg) rotateY(-38deg) rotateZ(0); } 25% { transform: rotateX(-32deg) rotateY(-36deg) rotateZ(2.5deg); } 75% { transform: rotateX(-32deg) rotateY(-40deg) rotateZ(-2.5deg); } }
.cubewrap.burstopen .ft { animation: lidoff .7s cubic-bezier(.2, .7, .3, 1) forwards; }
.cubewrap.burstopen .cube { animation: cubegone .7s .15s ease-in forwards; }
.cubewrap.burstopen::before { content: ""; position: absolute; left: 30%; right: 30%; bottom: 45%; height: 260%; z-index: 3; pointer-events: none;
  background: linear-gradient(0deg, var(--rb), color-mix(in srgb, var(--rb) 30%, transparent) 60%, transparent); filter: blur(6px); animation: beam .8s ease-out forwards; transform-origin: bottom; }
@keyframes lidoff { to { transform: rotateX(90deg) translateZ(calc(var(--s) * 2.4)) rotateZ(30deg); opacity: 0; } }
@keyframes cubegone { to { transform: rotateX(-32deg) rotateY(-38deg) scale(.4); opacity: 0; } }
@keyframes beam { from { transform: scaleY(0); opacity: 1; } 60% { opacity: 1; } to { transform: scaleY(1); opacity: 0; } }
.boxstage { border: 0; background: none; padding: 0; position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer; }
.boxbtn .cubewrap { width: 100%; height: auto; aspect-ratio: 1 / 1; }

/* ---------- loot reel ---------- */
.reel { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; gap: 22px; min-height: 0; }
.reel[hidden] { display: none; }
.reelwin { position: relative; overflow: hidden; margin: 0 -16px; padding: 18px 0; -webkit-mask: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
.strip { display: flex; gap: 8px; will-change: transform; padding-left: 0; }
.rt { --tc: #9fb3cc; flex: none; width: 96px; height: 118px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 6px;
  border: 1px solid color-mix(in srgb, var(--tc) 60%, transparent); background: radial-gradient(90% 70% at 50% 100%, color-mix(in srgb, var(--tc) 35%, transparent), transparent 70%), #08111f;
  box-shadow: inset 0 -3px 0 var(--tc), 0 0 12px color-mix(in srgb, var(--tc) 30%, transparent); }
.rt span { font-family: var(--font-display); font-weight: 600; font-size: 12px; line-height: 1.1; text-align: center; color: #dbe8ff; max-height: 2.3em; overflow: hidden; }
.rt.lit { animation: winpulse 1s ease-in-out infinite; box-shadow: inset 0 -3px 0 var(--tc), 0 0 26px var(--tc), 0 0 0 2px var(--tc); }
@keyframes winpulse { 50% { transform: scale(1.06); } }
.marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; translate: -50% 0; background: linear-gradient(#fff, var(--glow), #fff); box-shadow: 0 0 12px var(--glow), 0 0 24px var(--glow); z-index: 2; }
.marker::before, .marker::after { content: ""; position: absolute; left: 50%; translate: -50% 0; border: 8px solid transparent; }
.marker::before { top: 0; border-top-color: #fff; }
.marker::after { bottom: 0; border-bottom-color: #fff; }
.reelres { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-height: 160px; }
.reelres h2 { margin: 0; font-family: var(--font-display); font-size: 26px; letter-spacing: .08em; text-transform: uppercase; }
.reelres .vsum-actions { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.framepreview { margin: 8px 0 2px; }
.ri { display: grid; place-items: center; font-style: normal; flex: none; }
.ri-pack { width: 40px; height: 56px; border-radius: 4px; background: linear-gradient(115deg, var(--p1), var(--p2) 50%, var(--p1)); box-shadow: 0 0 10px rgb(0 0 0 / .5), inset 0 0 0 1px rgb(255 255 255 / .25); }
.ri-pack b { font-family: var(--font-display); font-size: 18px; color: #fff; text-shadow: 0 0 6px var(--p2); }
.ri-frame { width: 50px; height: 50px; border-radius: 14px; background: var(--frb); padding: 5px; }
.ri-frame::after { content: ""; display: block; width: 100%; height: 100%; border-radius: 10px; background: #08111f; }
.ri-title { width: 54px; height: 32px; border: 1px solid var(--tc, #9fb3cc); color: var(--tc, #9fb3cc); font-size: 22px; line-height: 1; background: #08111f; }
.ri-lock { width: 44px; height: 44px; border: 1px dashed var(--tc); color: var(--tc); font-family: var(--font-display); font-weight: 700; font-size: 20px; opacity: .6; }

/* ---------- appearance: picture inside a frame ---------- */
@property --fa { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.av { --frb: linear-gradient(135deg, #24406b, #3a6aa8, #24406b); position: relative; display: inline-block; width: 48px; height: 48px; padding: 3px; border-radius: 13px; background: var(--frb); flex: none; }
.av.lg { width: 80px; height: 80px; padding: 5px; border-radius: 20px; }
.av .avi { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 10px; overflow: hidden; background: #08111f; }
.av.lg .avi { border-radius: 15px; }
.av img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
.avt { font-size: 22px; line-height: 1; }
.av.lg .avt { font-size: 36px; }
.avt.rk { font-family: var(--font-display); font-weight: 700; color: var(--gold); font-size: 20px; }
.av.lg .avt.rk { font-size: 34px; }
.av.spin, .ri-frame.spin { animation: frspin 4s linear infinite; }
@keyframes frspin { to { --fa: 360deg; } }
.av.glow, .ri-frame.glow { box-shadow: 0 0 14px rgb(255 214 110 / .55); }
.av.glitch, .ri-frame.glitch { animation: frspin 2s linear infinite, jolt 3.7s steps(1) infinite; }
.row .av { grid-row: span 2; }
.phead .av { grid-row: span 3; }
.look { display: flex; gap: 14px; align-items: flex-start; }
.lookp { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lookp label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
.lookp select { width: 100%; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 8px 10px; color: var(--fg); }
.cosgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cos { --tc: #9fb3cc; display: flex; align-items: center; gap: 10px; border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); background: var(--sunk); padding: 8px; text-align: left; min-width: 0; box-shadow: inset 3px 0 0 var(--tc); }
.cos span { display: flex; flex-direction: column; min-width: 0; font-family: var(--font-display); font-weight: 600; font-size: 14px; line-height: 1.15; }
.cos small { font-family: var(--font-body); font-weight: 500; font-size: 11.5px; color: var(--muted); }
.cos .ri-frame { width: 38px; height: 38px; border-radius: 11px; padding: 4px; }
.cos .ri-title { width: 38px; height: 28px; font-size: 18px; }
.cos.lock { opacity: .5; }
.odds summary { cursor: pointer; color: var(--glow); font-size: 13px; }
.odds table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
.odds th, .odds td { padding: 4px 3px; text-align: center; border-bottom: 1px solid var(--edge-dim); }
.odds td:first-child { text-align: left; }
.odds p { font-size: 12.5px; color: var(--muted); }

/* ---------- fuel ---------- */
.fuel { display: flex; flex-direction: column; gap: 9px; border-color: #3a9a6a; box-shadow: 0 0 22px rgb(94 227 154 / .16); }
.fuel::before, .fuel::after { border-color: #5ee39a; }
.fuel .tag { color: #5ee39a; }
.fbar { display: flex; flex-direction: column; gap: 4px; }
.fbar .frow { display: flex; justify-content: space-between; align-items: baseline; }
.fbar .frow span { font-family: var(--font-display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12.5px; color: var(--muted); }
.fbar b { font-family: var(--font-display); font-size: 21px; line-height: 1; }
.fbar b small { font-size: 13px; color: var(--muted); }
.fbar > small { color: var(--muted); font-size: 12px; }
.fbar .xp i { background: linear-gradient(90deg, #2f8a5c, #5ee39a); box-shadow: 0 0 10px #5ee39a; }
.fbar.ok b { color: #5ee39a; }
.fbar.over .xp i { background: linear-gradient(90deg, #b3192e, #ff5d6c); box-shadow: 0 0 10px #ff5d6c; }
.fbar.over b { color: var(--red); }
.fuelov { touch-action: auto; }
.fbody { flex: 1; width: 100%; max-width: 560px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; -webkit-overflow-scrolling: touch; }
.fsum { display: flex; flex-direction: column; gap: 10px; border: 1px solid #3a9a6a; background: var(--sunk); padding: 12px; }
.fsec h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 14px; color: #5ee39a; display: flex; justify-content: space-between; gap: 10px; }
.fsec h3 small { color: var(--muted); letter-spacing: .04em; font-weight: 600; text-transform: none; font-size: 12px; }
.fquick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.fquick > input { grid-column: 1 / -1; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 10px 11px; font-size: 16px; }
.fsave { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 7px 10px; text-align: left; display: flex; flex-direction: column; max-width: 100%; }
.fchip b { font-weight: 600; font-size: 13.5px; line-height: 1.2; }
.fchip small { color: var(--muted); font-size: 11.5px; }
.fchip:active { border-color: #5ee39a; }
.flog { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.flog > div { display: flex; align-items: center; gap: 8px; border: 1px solid var(--edge-dim); background: var(--sunk); padding: 7px 9px; }
.flog > div > span:first-child { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.flog small { color: var(--muted); font-size: 12px; }
.flog .step { display: inline-flex; align-items: center; gap: 6px; }
.flog .btn { padding: 4px 10px; }
.fueltick { color: #5ee39a; }
/* ---------- muscle map ---------- */
.mmcard { display: flex; flex-direction: column; gap: 10px; }
.mmcard .toggle { flex-wrap: wrap; gap: 8px; }
.mmwrap { display: grid; grid-template-columns: minmax(0, 1fr) 128px; gap: 10px; align-items: center; }
.mmstage { touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; padding: 4px 0; }
.mmstage:active { cursor: grabbing; }
.mmspin { position: relative; aspect-ratio: 200 / 460; max-height: 430px; margin: 0 auto; will-change: transform; }
.mmface { position: absolute; inset: 0; }
.mmface[hidden] { display: none; }
.mmsvg { width: 100%; height: 100%; display: block; overflow: visible; }
.mmsil { fill: #222937; }
.mmline { fill: none; stroke: #3b4559; stroke-width: .8; }
.mmhead { stroke: #3b4559; stroke-width: .8; }
.mmshadow { fill: rgb(var(--glow-rgb) / .12); }
.mmm { stroke: #0a0e17; stroke-width: .7; stroke-linejoin: round; transition: fill .4s, opacity .2s; cursor: pointer; }
.mmm.hot { filter: drop-shadow(0 0 2.5px rgb(76 195 255 / .75)); }
.mmm.sel { stroke: #fff; stroke-width: 1.4; }
.mmside { display: flex; flex-direction: column; gap: 10px; }
.mmside .btn { padding: 8px 6px; font-size: 13px; }
.mmlegend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.mmlegend span { display: grid; grid-template-columns: 14px 1fr; column-gap: 7px; line-height: 1.15; }
.mmlegend i { width: 14px; height: 14px; grid-row: span 2; border: 1px solid #0a0e17; }
.mmlegend small { font-size: 11px; opacity: .8; }
.mminfo { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 10px 11px; display: flex; flex-direction: column; gap: 6px; }
.mminfo .sub { margin: 0; }
.mminfo .toggle b { font-family: var(--font-display); font-size: 19px; letter-spacing: .03em; }
.mminfo .btn { padding: 3px 9px; }
.mmhint { font-size: 12px; opacity: .8; }
.mmbar { position: relative; display: block; height: 7px; background: #141a26; border: 1px solid var(--edge-dim); }
.mmbar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .4s; }
.mmbar span { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: .7; }
.mmall summary { cursor: pointer; color: var(--glow); font-size: 13px; }
.mmrows { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.mmrow { display: grid; grid-template-columns: 9.5em 1fr 2.6em; gap: 8px; align-items: center; text-align: left; background: none; border: 0; padding: 3px 0; color: var(--fg); font-size: 13px; }
.mmrow b { text-align: right; font-family: var(--font-display); }

.hpriv { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; border: 1px solid var(--edge-dim); background: var(--panel); padding: 10px 12px; }
.mmmini { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 300px; margin: 0 auto; width: 100%; }
.mmmini .mmsvg { height: auto; aspect-ratio: 200 / 460; }
.mmmini .mmm { cursor: default; }
.mmlegend.row { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px 12px; }
.mmlegend.row span { display: inline-flex; align-items: center; gap: 5px; }
.mmlegend.row i { width: 11px; height: 11px; }
.balance { display: flex; flex-direction: column; gap: 8px; }
.balance .toggle .sub { margin: 0; }
.bal { margin: 0; font-size: 13.5px; padding: 6px 9px; border-left: 2px solid var(--edge-dim); background: var(--sunk); }
.bal b { display: block; font-family: var(--font-display); letter-spacing: .12em; text-transform: uppercase; font-size: 11.5px; }
.bal.bad { border-color: var(--red); } .bal.bad b { color: var(--red); }
.bal.warn { border-color: #2a96dc; } .bal.warn b { color: #4cc3ff; }
.bal.hi { border-color: var(--gold); } .bal.hi b { color: var(--gold); }
.bal.ok { border-color: #5ee39a; } .bal.ok b { color: #5ee39a; }
@media (max-width: 360px) { .mmwrap { grid-template-columns: minmax(0, 1fr) 104px; } }

/* ---------- warm-ups, swaps ---------- */
.wu { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; padding: 2px 0 2px 11px; border-left: 2px solid var(--edge-dim); }
.wu > span { flex-basis: 100%; font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
.wu b { color: var(--fg); font-weight: 600; white-space: nowrap; }
.wu small { flex-basis: 100%; font-size: 11.5px; }
.swapbox { border: 1px dashed var(--edge-dim); padding: 8px; margin-top: 4px; }
.swapbox .sub { margin: 0 0 6px; }
.swapped { margin: 0; font-size: 12px; color: var(--gold); }

/* ---------- recipes, report ---------- */
.rcbox { border: 1px solid #3a9a6a; background: var(--sunk); padding: 12px; }
.rctot { margin: 6px 0; font-size: 13.5px; color: var(--muted); }
.rctot b { color: var(--fg); }
.report { display: flex; flex-direction: column; gap: 8px; border-color: #7a5cc4; box-shadow: 0 0 22px rgb(180 107 255 / .16); }
.report::before, .report::after { border-color: #b46bff; }
.report .tag { color: #c99bff; }
.report .nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.report .num { display: flex; flex-direction: column; align-items: flex-start; }
.report .num b { font-family: var(--font-display); font-size: 21px; line-height: 1.1; }
.report .num small { color: var(--muted); font-size: 11px; }
.report .sub { margin: 0; line-height: 1.55; }
.repfocus { margin: 2px 0 0; border-left: 2px solid #b46bff; padding: 4px 0 4px 9px; font-size: 14px; }
.repfocus span { display: block; font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11.5px; color: #c99bff; }

/* ---------- system target, weekly budget, scanner ---------- */
.sys { margin: 2px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; border-left: 2px solid var(--glow); padding: 4px 0 4px 9px; background: linear-gradient(90deg, rgb(var(--glow-rgb) / .08), transparent); }
.sys > span { font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11.5px; color: var(--glow); }
.sys b { font-family: var(--font-display); font-size: 17px; color: var(--fg); }
.sys i { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 1px 6px; border: 1px solid currentColor; }
.sys.up { border-color: #5ee39a; } .sys.up i { color: #5ee39a; }
.sys.down { border-color: var(--gold); } .sys.down i { color: var(--gold); }
.sys small { flex-basis: 100%; color: var(--muted); font-size: 12.5px; }
.wbud { margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--edge-dim); }
.wbud small b { color: var(--fg); }
.scanov { position: fixed; inset: 0; z-index: 80; background: rgb(3 6 14 / .97); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 16px 16px; }
.scanov[hidden] { display: none; }
.scanov .vtop { width: 100%; max-width: 560px; }
.scanov .sub, .scanov .fsearch { width: 100%; max-width: 560px; }
.scbox { position: relative; width: 100%; max-width: 560px; aspect-ratio: 4 / 3; background: #000; border: 1px solid var(--edge-dim); overflow: hidden; }
.scbox[hidden] { display: none; }
.scbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scbox i { position: absolute; left: 12%; right: 12%; top: 32%; bottom: 32%; border: 2px solid var(--glow); box-shadow: 0 0 0 999px rgb(0 0 0 / .35), 0 0 16px rgb(var(--glow-rgb) / .6); pointer-events: none; }

/* ---------- side quest, charts, body log ---------- */
.side { display: flex; flex-direction: column; gap: 7px; border-color: #b98a3a; box-shadow: 0 0 20px rgb(255 200 97 / .14); }
.side::before, .side::after { border-color: var(--gold); }
.side .tag { color: var(--gold); }
.side > b { font-family: var(--font-display); font-size: 19px; letter-spacing: .03em; }
.side > small { color: var(--muted); font-size: 12.5px; }
.side .xp i { background: linear-gradient(90deg, #a87a1c, var(--gold)); box-shadow: 0 0 10px var(--gold); }
.side.done > b { color: var(--gold); }
.side.done > b::after { content: " ✓"; }
.lchart { margin: 6px 0 8px; }
.lchart svg { width: 100%; height: auto; display: block; overflow: visible; }
.lchart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.lchart line { stroke: var(--edge-dim); stroke-width: 1; }
.lchart figcaption { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 2px; }
.lchart figcaption i { display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; }
.bnote { margin: 0; font-size: 13px; color: var(--muted); border: 1px solid var(--edge-dim); background: var(--sunk); padding: 9px 11px; }
.bnote b { color: #5ee39a; }
.bmeas summary { cursor: pointer; color: var(--glow); font-size: 13px; margin: 6px 0; }
.btn.file { position: relative; cursor: pointer; }
.bgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bph { border: 1px solid var(--edge-dim); background: var(--sunk); padding: 0; display: flex; flex-direction: column; text-align: center; overflow: hidden; }
.bph img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; background: #08111f; }
.bph span { font-size: 11px; color: var(--muted); padding: 3px 0; }
.bph.sel { border-color: var(--glow); box-shadow: 0 0 10px rgb(var(--glow-rgb) / .5); }
